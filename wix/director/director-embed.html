<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#edf0f0; --surface:#ffffff; --surface-2:#f4f6f6; --line:#d2dadb;
  --ink:#11242b; --ink-2:#4b5f66;
  --primary:#0b5d6b; --on-primary:#ffffff;
  --good:#17803d; --warn:#a85a00; --bad:#b42318; --good-bg:#dcf1e4; --warn-bg:#fbe8c8; --bad-bg:#f8d9d5; --info-bg:#e3eef0;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1619; --surface:#142125; --surface-2:#1a2b30; --line:#2a3d43;
    --ink:#e6eef0; --ink-2:#9db0b6; --primary:#5cc7d6; --on-primary:#06191d;
    --good:#4cc77a; --warn:#f0a640; --bad:#ff8a80; --good-bg:#16351f; --warn-bg:#3a2a0d; --bad-bg:#3d1a17; --info-bg:#1b3138;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h2,h3,p{margin:0}
small,.muted{font-size:13px;color:var(--ink-2)}
[hidden]{display:none!important}
.app{max-width:1180px;margin-inline:auto;padding:0 16px 56px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.between{justify-content:space-between}
.eyebrow{font:600 13px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:3px 0 0;font:700 clamp(24px,5vw,34px)/1.05 var(--f-display)}
h2{font:700 24px/1.1 var(--f-display);letter-spacing:.01em}
h3{font:700 18px/1.2 var(--f-display);letter-spacing:.02em}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
.tab{border:0;background:none;padding:10px 14px;font:700 17px var(--f-display);letter-spacing:.04em;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi .n{font:700 38px/1 var(--f-display)}
.kpi .l{font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font:700 12px var(--f-body);padding:3px 9px;border-radius:99px;background:var(--info-bg);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-height:38px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font:600 13px var(--f-body);color:var(--ink-2)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.scroll{overflow-x:auto}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--info-bg);margin-top:8px}
.alert.warn{background:var(--warn-bg)}.alert.bad{background:var(--bad-bg)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:380px;margin:12vh auto 0}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.sec{margin-top:6px;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--surface-2)}
.chk input{margin-top:3px;min-height:0;width:18px;height:18px}
.chk.done span{text-decoration:line-through;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="expoWrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var ROLES=['Aid station / hydration','Course marshal','Start line crew','Finish line crew','Medal and finisher goodies','Finisher food and recovery','Bib and packet pickup (expo)','T-shirt / swag handout','Registration and check-in help','Information booth','Baggage check','Timing and results support','Medical support (first aid)','Sweeper / back-of-pack','Bike or cart escort','Traffic and road crossing','Parking and shuttle','Pacer support','Kids run helper','Cheer zone','Photography and social media','Set-up and tear-down','Sponsor and partner booth','Water and sanitation (toilets, bins)'];
var ERR={not_logged_in:'Your session ended. Please log in again.',bad_login:'Wrong username or password.',locked:'Too many wrong tries. Wait 10 minutes.',not_allowed:'This login is not set up for the Director. Ask for a director, lead or viewer role.',setup_needed:'Setup is not finished. Run the one-time setup first.',
  read_only:'Your login can only look, not change.',director_only:'Only a director login can do that.',no_event:'That race was not found.',name_needed:'Please enter a name.',bad_date:'Please use a real date.',bad_distance:'Distance must be between 1 and 100 km.',bad_status:'That status is not allowed.',
  role_needed:'Please enter a role name.',bad_time:'Times must look like 05:30 and end after they start.',bad_need:'Please enter a number of people.',need_below_taken:'More people are already on this shift than that.',no_shift:'That shift was not found.',shift_has_checkins:'Some people already checked in to this shift.',
  shift_full:'That shift is full.',shifts_overlap:'Those shifts overlap in time.',no_volunteer:'Volunteer not found.',already_assigned:'Already on that shift.',volunteer_declined:'This volunteer was declined.',bad_phone:'Please enter a 10-digit mobile number.',already_signed_up:'That mobile number is already registered.',
  not_found:'No volunteer with that code.',not_approved:'This volunteer is not approved yet.',no_confirmed_shift:'No confirmed shift for this volunteer.',nothing_to_check:'Nothing to check in or out.',already_in:'Already checked in.',not_checked_in:'Not checked in yet.',already_out:'Already checked out.',already_checked_in:'They already checked in, so this cannot change.',no_assignment:'Shift assignment not found.',
  text_needed:'Please write a little more.',bad_kind:'Pick a type.',resolution_needed:'Say how it was resolved.',already_closed:'Already closed.',no_item:'Item not found.',wix_event_not_linked:'Link this race to its Wix event first.',wix_events_unavailable:'Wix Events did not answer. Try again in a minute.',wix_events_denied:'Wix Events refused access. Check that the Events app is installed on this site.',bad_quals:'Check the rules: each line needs a different category and at least one way to qualify (distance, time or both). Times look like 3:00.',no_runner:'That runner was not found.',no_rule:'This category has no qualification rule.',bad_claim:'Check the distance and the time (for example 21.1 and 2:45:10).',bad_link:'The proof link must start with http.',note_needed:'Please write a short reason.',bad_groups:'Check the pace groups: names must be different and not empty.',bad_finish:'Finish time must look like 1:45 or 2:00:00, between 20 minutes and 8 hours.',bad_group:'That pace group does not exist.',group_needed:'Choose a pace group first.',no_pacer:'Pacer not found.',timeout:'No answer from the server. Try again.'};
var msg=function(e){return ERR[e]||('Something went wrong ('+e+')')};

var EXPO_SRC=null; /* filled in by tools/build_rd.py: the Expo desk page, shown in the Expo desk tab */
var S={cred:null,expoOnly:false,token:'',me:null,events:[],ev:'',tab:'overview',ov:null,shifts:[],vols:[],run:[],log:[],logFilter:'open',pace:null,checks:[],qual:null,qF:'pending',regs:null,mapOpen:false,wixEvents:null,wixForm:null,regQ:'',impMsg:'',busy:false,armed:null,volQ:'',volF:'all',editShift:null,editPacer:null,editEvent:null,loginErr:'',base:'https://www.vtra.run/volunteer',setupErr:'',ci:''};
try{var b=localStorage.getItem('rd.base');if(b)S.base=b}catch(e){}
var pending={},seq=0;
var xmap={},xseq=0;
window.addEventListener('message',function(e){
  var m=e.data;
  // The Expo desk runs in a frame inside this page. Its requests are passed up to the page code tagged mod:'expo',
  // and the answers are passed back down. Only a frame we made can send a 'call' to this page.
  var xf=$('#expoFrame');
  if(m&&m.kind==='call'&&xf&&(!e.source||e.source===xf.contentWindow)){if(S.cred){var c=S.cred;S.cred=null;setTimeout(function(){xf.contentWindow.postMessage({kind:'autologin',username:c.u,password:c.p},'*')},0)}var xid='x'+(++xseq);xmap[xid]=m.id;window.parent.postMessage({kind:'call',id:xid,method:m.method,arg:m.arg,mod:'expo'},'*');return}
  if(m&&m.kind==='result'&&xmap[m.id]){var oid=xmap[m.id];delete xmap[m.id];if(xf&&xf.contentWindow)xf.contentWindow.postMessage(Object.assign({},m,{id:oid}),'*');return}
  if(!m||m.kind!=='result'||!pending[m.id])return;
  var p=pending[m.id];delete pending[m.id];clearTimeout(p.t);
  if(m.ok)p.res(m.result);else{if(m.error==='not_logged_in'&&S.token){S.token='';S.me=null;S.loginErr=msg('not_logged_in');render()}p.rej(new Error(m.error||'failed'))}
});
function api(method,arg,ms){
  return new Promise(function(res,rej){
    var id=++seq;var t=setTimeout(function(){delete pending[id];rej(new Error('timeout'))},ms||30000);
    pending[id]={res:res,rej:rej,t:t};
    window.parent.postMessage({kind:'call',id:id,method:method,arg:Object.assign({token:S.token,ev:S.ev},arg||{})},'*');
  });
}
var tt;
function toast(t,bad){var el=$('#toast');el.textContent=t;el.className='toast'+(bad?' err':'');el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},bad?5000:2500)}
function can(){return !!(S.me&&S.me.canWrite)}
function man(){return !!(S.me&&S.me.canManage)}
function pill(t,k){return '<span class="pill '+(k||'')+'">'+esc(t)+'</span>'}
function fdate(d){if(!d)return '';var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function ftime(iso){if(!iso)return '';var x=new Date(iso);return isNaN(x)?'':x.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function pct(a,b){return b>0?Math.min(100,Math.round(a*100/b)):0}
function bar(a,b){return '<div class="bar"><i style="width:'+pct(a,b)+'%"></i></div>'}
// two-step buttons: the first click arms, the second does it
function arm(key,label,act,extra){return '<button class="btn sm bad" data-act="'+act+'" data-arm="'+esc(key)+'" '+(extra||'')+'>'+(S.armed===key?'Sure?':esc(label))+'</button>'}

/* ---------- loading ---------- */
async function run(fn){
  if(S.busy)return;S.busy=true;
  try{return await fn()}catch(e){toast(msg(e.message),true)}finally{S.busy=false}
}
async function loadEvents(){
  var r=await api('listEvents');S.events=r.events.filter(function(e){return e.status!=='archived'});
  if(!S.events.some(function(e){return e.id===S.ev}))S.ev=S.events.length?S.events[0].id:'';
  try{var last=localStorage.getItem('rd.ev');if(last&&S.events.some(function(e){return e.id===last}))S.ev=last}catch(e){}
}
async function loadTab(){
  if(!S.ev){render();return}
  var t=S.tab;
  try{
    if(t==='overview')S.ov=await api('overview');
    else if(t==='volunteers'){var a=await Promise.all([api('listShifts'),api('listVolunteers')]);S.shifts=a[0].shifts;S.vols=a[1].volunteers}
    else if(t==='raceday'){var b=await Promise.all([api('listRun'),api('listLog')]);S.run=b[0].items;S.log=b[1].items}
    else if(t==='pacers')S.pace=await api('listPacers');
    else if(t==='safety')S.checks=(await api('listChecklist')).items;
    else if(t==='quals')S.qual=await api('listQuals');
    else if(t==='regs')S.regs=await api('listRegs');
  }catch(e){toast(msg(e.message),true)}
  render();
}
async function afterLogin(){
  await loadEvents();
  if(!S.events.length&&man())S.tab='setup';
  else if(S.tab==='setup'&&S.events.length)S.tab='overview';
  render();await loadTab();
}

/* ---------- views ---------- */
function loginView(){
  return '<div class="login card"><div class="eyebrow">VTRA</div><h1>Race Director</h1><p class="muted" style="margin-top:6px">Log in with the username and password you were given.</p>'
   +'<form id="loginForm"><label class="f">Username<input id="lgUser" autocomplete="username" required></label><label class="f">Password<input id="lgPass" type="password" autocomplete="current-password" required></label>'
   +'<button class="btn pri" type="submit">Log in</button><div id="lgErr" class="muted" style="color:var(--bad)" role="alert">'+esc(S.loginErr)+'</div></form>'
   +'<details style="margin-top:16px"><summary class="muted">First-time setup (owner only)</summary><form id="setupForm" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">'
   +'<label class="f">Setup key<input id="suKey" type="password"></label><label class="f">New admin username<input id="suUser"></label><label class="f">New admin password<input id="suPass" type="password"></label>'
   +'<button class="btn" type="submit">Create database</button><div id="suMsg" class="muted" role="status">'+esc(S.setupErr)+'</div></form></details></div>';
}
var TABS_BASE=[['overview','Overview'],['volunteers','Volunteers'],['raceday','Race day'],['pacers','Pacers'],['safety','Safety'],['regs','Registrations'],['quals','Qualification']];
function head(){
  var ev=S.events.find(function(e){return e.id===S.ev});
  var tabs=TABS_BASE.concat(man()&&EXPO_SRC?[['expo','Expo desk']]:[],man()?[['setup','Setup']]:[]);
  return '<div class="top"><div class="row between"><div><div class="eyebrow">VTRA Race Director</div><h1>'+esc(ev?ev.name:'No race yet')+'</h1>'
   +(ev?'<small>'+esc(fdate(ev.date))+(ev.venue?' · '+esc(ev.venue):'')+(ev.daysToGo!==null?' · '+(ev.daysToGo>0?ev.daysToGo+' days to go':ev.daysToGo===0?'race day':'finished'):'')+'</small>':'')+'</div>'
   +'<div class="row">'+(S.events.length>1?'<select id="evPick" aria-label="Race">'+S.events.map(function(e){return '<option value="'+esc(e.id)+'"'+(e.id===S.ev?' selected':'')+'>'+esc(e.name)+'</option>'}).join('')+'</select>':'')
   +'<span class="muted">'+esc(S.me.name)+' · '+esc(S.me.role)+'</span><button class="btn sm" data-act="logout">Log out</button></div></div>'
   +'<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div>';
}
function noEvent(){return '<div class="card"><h3>No race yet</h3><p class="muted" style="margin-top:6px">'+(man()?'Open the Setup tab and create your first race.':'Ask a director to create the race first.')+'</p></div>'}

function overviewView(){
  var o=S.ov;if(!o)return '<p class="muted">Loading…</p>';
  var v=o.volunteers,x=o.expo,al=o.alerts;
  var goTab={regs:'Registrations',volunteers:'Volunteers',raceday:'Race day',pacers:'Pacers',safety:'Safety',quals:'Qualification'};
  return '<div class="grid g4">'
   +'<div class="card kpi"><div class="l">Runners checked in</div><div class="n">'+(x?x.checkedIn:'–')+(x?' <small>/ '+x.total+'</small>':'')+'</div>'+(x?bar(x.checkedIn,x.total):'<small>Link the Expo race in Setup</small>')+'</div>'
   +'<div class="card kpi"><div class="l">Bibs and T-shirts given</div><div class="n">'+(x?x.bibs+' · '+x.shirts:'–')+'</div><small>'+(x?'bibs · T-shirts':'from the Expo desk')+'</small></div>'
   +'<div class="card kpi"><div class="l">Volunteer spots filled</div><div class="n">'+v.taken+' <small>/ '+v.need+'</small></div>'+bar(v.taken,v.need)+'<small>'+v.confirmed+' confirmed · '+v.applied+' waiting · '+v.onSite+' on site</small></div>'
   +'<div class="card kpi"><div class="l">Pacers</div><div class="n">'+o.pacers.have+' <small>/ '+o.pacers.need+'</small></div>'+bar(o.pacers.have,o.pacers.need)+'</div>'
   +'<div class="card kpi"><div class="l">Safety checklist</div><div class="n">'+o.checklist.done+' <small>/ '+o.checklist.total+'</small></div>'+bar(o.checklist.done,o.checklist.total)+'</div>'
   +'<div class="card kpi"><div class="l">Run of show</div><div class="n">'+o.run.done+' <small>/ '+o.run.total+'</small></div>'+bar(o.run.done,o.run.total)+'</div>'
   +'<div class="card kpi"><div class="l">Open incidents</div><div class="n" style="'+(o.log.open?'color:var(--bad)':'')+'">'+o.log.open+'</div><small>'+o.log.total+' logged</small></div></div>'
   +'<div class="card" style="margin-top:14px"><h3>Needs attention</h3>'+(al.length?al.map(function(a){return '<div class="alert '+(a.level==='bad'?'bad':a.level==='warn'?'warn':'')+'"><span>'+esc(a.text)+'</span><button class="btn sm" data-act="tab" data-tab="'+esc(a.go)+'">'+esc(goTab[a.go]||'Open')+'</button></div>'}).join(''):'<p class="muted" style="margin-top:6px">Nothing needs you right now.</p>')+'</div>';
}

function shiftForm(){
  var s=S.editShift;if(!s||!can())return '';
  return '<form id="shiftForm" class="card" style="margin-top:10px"><h3>'+(s.id?'Edit shift':'New shift')+'</h3><div class="form" style="margin-top:8px">'
   +'<label class="f">Role<input name="role" list="roleList" value="'+esc(s.role)+'" required autocomplete="off"></label><datalist id="roleList">'+ROLES.map(function(r){return '<option value="'+esc(r)+'">'}).join('')+'</datalist><label class="f">Location<input name="location" value="'+esc(s.location)+'"></label>'
   +'<label class="f">Date<input name="date" type="date" value="'+esc(s.date)+'" required></label><label class="f">Start<input name="start" type="time" value="'+esc(s.start)+'" required></label>'
   +'<label class="f">End<input name="end" type="time" value="'+esc(s.end)+'" required></label><label class="f">People needed<input name="need" type="number" min="1" max="500" value="'+esc(s.need)+'" required></label>'
   +'<label class="f">Notes for volunteers<input name="notes" value="'+esc(s.notes)+'"></label></div><div class="row" style="margin-top:10px"><button class="btn pri" type="submit">Save shift</button><button class="btn" type="button" data-act="shiftCancel">Cancel</button></div></form>';
}
function volView(){
  var shifts=S.shifts,q=S.volQ.toLowerCase();
  var list=S.vols.filter(function(v){return (S.volF==='all'||v.status===S.volF)&&(!q||v.name.toLowerCase().indexOf(q)>=0||v.phone.indexOf(q)>=0||v.code.toLowerCase()===q||v.club.toLowerCase().indexOf(q)>=0)});
  var link=S.base+(S.base.indexOf('?')<0?'?':'&')+'ev='+encodeURIComponent(S.ev);
  var counts={all:S.vols.length,applied:0,approved:0,declined:0};S.vols.forEach(function(v){counts[v.status]++});
  return '<div class="stack">'
   +'<div class="card"><div class="row between"><h3>Volunteer sign-up link</h3><button class="btn sm" data-act="copyLink">Copy link</button></div><p class="muted" style="margin:6px 0">Share this link on WhatsApp and Instagram. Volunteers pick their shifts and agree to the waiver; you approve them below.</p>'
   +'<div class="row"><input id="baseUrl" value="'+esc(S.base)+'" aria-label="Sign-up page address" style="flex:1;min-width:220px"><code id="linkOut" style="word-break:break-all">'+esc(link)+'</code></div></div>'
   +'<div class="card"><div class="row between"><h3>Shifts</h3>'+(can()?'<button class="btn pri sm" data-act="shiftNew">+ Add shift</button>':'')+'</div>'
   +'<div class="scroll"><table><tr><th>Role</th><th>Where</th><th>When</th><th>Filled</th><th>On site</th><th></th></tr>'

var VERD={meets:['Meets rule','good'],below:['Below rule','bad'],noclaim:['No claim yet','warn'],manual:['Check by hand','warn']};
var QST={pending:['Pending',''],approved:['Approved','good'],rejected:['Rejected','bad'],waived:['Waived','warn']};
function rulesToText(rs){return rs.map(function(r){return [r.cat,r.text,r.alts.map(function(a){return (a.minKm||'')+'@'+(a.maxSec?hmsUi(a.maxSec):'')}).join('; ')].join(' | ')}).join('\n')}
function hmsUi(t){return Math.floor(t/3600)+':'+String(Math.floor(t%3600/60)).padStart(2,'0')}
function textToRules(tx){return tx.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split('|').map(function(x){return x.trim()});return {cat:p[0],text:p[1]||'',alts:(p[2]||'').split(';').map(function(x){return x.trim()}).filter(Boolean).map(function(a){var q=a.split('@');return {minKm:(q[0]||'').trim(),maxTime:(q[1]||'').trim()}})}})}

  var head='<div class="card"><div class="row between"><h3>Qualification checks</h3><select id="qF" aria-label="Show"><option value="pending"'+(S.qF==='pending'?' selected':'')+'>Needs a decision ('+c.pending+')</option><option value="all"'+(S.qF==='all'?' selected':'')+'>All ('+c.total+')</option></select></div><p class="muted" style="margin:4px 0">'+c.approved+' approved · '+c.waived+' waived · '+c.rejected+' rejected · '+c.noclaim+' with no claim yet. The check is a first opinion from what you record; you decide.</p>';

    var claimTxt=cl?esc(cl.text||'')+(cl.km?' · '+esc(cl.km)+' km':'')+(cl.time?' · '+esc(cl.time):'')+(cl.link?' · <a href="'+esc(cl.link)+'" target="_blank" rel="noopener noreferrer">proof</a>':''):'<small>none</small>';
    var acts=can()?'<input data-note="'+esc(r.runnerId)+'" placeholder="Reason (needed to reject, waive or approve below rule)" value="'+esc(r.note)+'" style="width:100%;margin-bottom:4px"><div class="row"><button class="btn sm pri" data-act="qOk" data-id="'+esc(r.runnerId)+'">Approve</button><button class="btn sm" data-act="qNo" data-id="'+esc(r.runnerId)+'">Reject</button>'+(man()?'<button class="btn sm" data-act="qWaive" data-id="'+esc(r.runnerId)+'">Waive</button>':'')+'</div>'
     +'<details style="margin-top:6px"><summary class="btn sm">'+(cl?'Edit claim':'Record claim')+'</summary><form class="claimForm form" data-rid="'+esc(r.runnerId)+'" style="margin-top:6px"><label class="f">Race and year<input name="text" value="'+esc(cl?cl.text:'')+'"></label><label class="f">Distance (km)<input name="km" type="number" step="0.001" min="0" value="'+esc(cl&&cl.km?cl.km:'')+'"></label><label class="f">Time (h:mm)<input name="time" value="'+esc(cl?cl.time:'')+'" placeholder="2:45"></label><label class="f">Proof link<input name="link" value="'+esc(cl?cl.link:'')+'" placeholder="https://"></label><button class="btn pri" type="submit">Save claim</button></form></details>':'';
    return '<tr><td><small>'+esc(r.ref)+'</small></td><td><b>'+esc(r.name)+'</b><br><small>'+esc(r.cat)+'</small></td><td><small>'+esc(r.rule)+'</small></td><td>'+claimTxt+'</td><td>'+pill(v[0],v[1])+'<br>'+pill(st[0],st[1])+(r.by&&r.status!=='pending'?'<br><small>'+esc(r.by)+'</small>':'')+'</td><td style="min-width:240px">'+acts+'</td></tr>'}).join('');
  return '<div class="stack">'+rules+head+'<div class="scroll"><table><tr><th>Ticket</th><th>Runner</th><th>Rule</th><th>Claim</th><th>Check</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="muted">Nothing to decide.</td></tr>')+'</table></div></div></div>';

function formMap(){
  var f=S.wixForm,m=f.map||{};
  function sel(k,label){return '<label class="f">'+label+'<select name="'+k+'"><option value="">(not asked / use default)</option>'+f.fields.map(function(x){return '<option value="'+esc(x.name)+'"'+(m[k]===x.name?' selected':'')+'>'+esc(x.name)+' — e.g. '+esc(x.sample.join(', '))+'</option>'}).join('')+'</select></label>'}
  return '<form id="mapForm" class="form" style="margin-top:8px">'+sel('size','T-shirt size field')+sel('bibName','Bib name field')+sel('phone','Phone field')+'<button class="btn pri" type="submit">Save</button></form><p class="muted" style="margin-top:6px">Looked at '+f.scanned+' tickets. Ticket names seen: '+f.tickets.map(function(t){return esc(t.name)+' ('+t.count+')'}).join(', ')+'.</p>';
}
function setupView(){
  var e=S.editEvent;
  var list=S.events.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(fdate(x.date))+'</td><td>'+esc(x.expoId||'–')+'</td><td>'+pill(x.status,x.status==='open'?'good':'')+'</td><td><button class="btn sm" data-act="evEdit" data-id="'+esc(x.id)+'">Edit</button></td></tr>'}).join('');
  e=e||{id:'',name:'',date:'',venue:'',expoId:'',status:'open',distanceKm:21.0975};
  return '<div class="stack"><div class="card"><h3>Races</h3><div class="scroll"><table><tr><th>Name</th><th>Date</th><th>Expo race</th><th>Status</th><th></th></tr>'+(list||'<tr><td colspan="5" class="muted">No race yet.</td></tr>')+'</table></div></div>'
   +'<form id="eventForm" class="card"><h3>'+(e.id?'Edit race':'New race')+'</h3><p class="muted" style="margin:4px 0 8px">A new race starts with a standard safety checklist, run of show and pace groups that you can change.</p><div class="form">'
   +'<label class="f">Race name<input name="name" value="'+esc(e.name)+'" required></label><label class="f">Date<input name="date" type="date" value="'+esc(e.date)+'"></label><label class="f">Venue<input name="venue" value="'+esc(e.venue)+'"></label>'
   +'<label class="f">Expo race ID (for runner counts)<input name="expoId" value="'+esc(e.expoId)+'" placeholder="Import910"></label><label class="f">Distance (km)<input name="distanceKm" type="number" step="0.0001" min="1" max="100" value="'+esc(e.distanceKm)+'"></label>'
   +'<label class="f">Status<select name="status">'+[['open','Open (volunteers can sign up)'],['closed','Closed'],['archived','Archived (hidden)']].map(function(s){return '<option value="'+s[0]+'"'+(e.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></label></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn pri" type="submit">Save race</button>'+(e.id?'<button class="btn" type="button" data-act="evNew">New race instead</button>':'')+'</div></form>'
   +'<div class="card"><h3>Who can log in</h3><p class="muted" style="margin-top:6px">Logins live in the CMS collection <b>ExpoStaff</b>. Set the <b>role</b> column: <b>admin</b> or <b>director</b> (everything), <b>lead</b> (volunteers, race day, pacers, safety), <b>viewer</b> (look only, for sponsors and partners). A login with role <b>desk</b> works only on the Expo desk.</p></div></div>';
}

function showExpo(on){
  var w=$('#expoWrap');if(!w)return;
  if(on&&EXPO_SRC&&!$('#expoFrame')){var f=document.createElement('iframe');f.id='expoFrame';f.title='Expo desk';f.srcdoc=EXPO_SRC;f.setAttribute('style','width:100%;height:88vh;min-height:620px;border:0;border-radius:12px;background:#fff');
    w.appendChild(f)}
  w.hidden=!on;
}
function dropExpo(){var f=$('#expoFrame');if(f){try{f.contentWindow.postMessage({kind:'shell-logout'},'*')}catch(x){}setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f)},400)}var w=$('#expoWrap');if(w)w.hidden=true}
function expoOnlyView(){return '<div class="top"><div class="row between"><div><div class="eyebrow">VTRA Race Director</div><h1>Expo desk</h1></div><div class="row"><span class="muted">'+esc((S.me&&S.me.name)||'')+'</span><button class="btn sm" data-act="logout">Log out</button></div></div></div>'}
function render(){
  var app=$('#app');
  if(S.expoOnly){app.innerHTML=expoOnlyView();showExpo(true);return}
  if(!S.token){app.innerHTML=loginView();showExpo(false);return}
  showExpo(S.tab==='expo'&&man());
  var body=!S.ev&&S.tab!=='setup'?noEvent():S.tab==='overview'?overviewView():S.tab==='volunteers'?volView():S.tab==='raceday'?racedayView():S.tab==='pacers'?paceView():S.tab==='safety'?safetyView():S.tab==='quals'?qualView():S.tab==='regs'?regsView():S.tab==='expo'?'':S.tab==='setup'&&man()?setupView():'';
  app.innerHTML=head()+body;
}

/* ---------- actions ---------- */
function formData(f){var o={};Array.prototype.forEach.call(f.elements,function(el){if(!el.name)return;o[el.name]=el.type==='checkbox'?el.checked:el.value});return o}
function download(name,text){try{var b=new Blob([text],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}catch(e){toast('Download is blocked here. Copy the list instead.',true)}}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function doTab(t){S.tab=t;S.armed=null;S.editShift=null;S.editPacer=null;render();await loadTab()}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  var ak=b.getAttribute('data-arm');
  if(ak){if(S.armed!==ak){S.armed=ak;render();return}S.armed=null}
  var go=function(fn){run(async function(){await fn();render()})};
  var reload=function(){return loadTab()};
  if(act==='tab')doTab(b.getAttribute('data-tab'));
  else if(act==='qOk'||act==='qNo'||act==='qWaive'){var ne=document.querySelector('[data-note="'+id+'"]');var nt=ne?ne.value:'';var stt=act==='qOk'?'approved':act==='qNo'?'rejected':'waived';run(async function(){await api('decideQual',{runnerId:id,status:stt,note:nt});toast('Saved');await reload()})}
  else if(act==='loadWix')run(async function(){S.wixEvents=(await api('listWixEvents')).events;render()});
  else if(act==='chkForm'){S.mapOpen=!S.mapOpen;render();if(S.mapOpen&&!S.wixForm)run(async function(){S.wixForm=await api('wixFormFields');render()})}
  else if(act==='unlinkWix')run(async function(){await api('linkWixEvent',{wixEventId:''});S.wixEvents=null;S.wixForm=null;toast('Unlinked');await loadTab()});
  else if(act==='impRegs')run(async function(){var cur='',add=0,upd=0,sk=0;for(var i=0;i<60;i++){var r=await api('importRegs',{cursor:cur});add+=r.added;upd+=r.updated;sk+=r.skipped.cancelled+r.skipped.noName;S.impMsg='importing... '+(add+upd);render();cur=r.next;if(r.done)break}S.impMsg='Imported: '+add+' new, '+upd+' updated, '+sk+' skipped (cancelled or no name)';await reload()});
  else if(act==='regCsv'){var rr=S.regs.rows;download('registrations.csv',[['Name','Email','Phone','Ticket','Ticket no.','Size','Bib name','Payment pending']].concat(rr.map(function(r){return [r.name,r.email,r.phone,r.cat,r.ticket,r.size,r.bibName,r.unpaid?'yes':'']})).map(function(r){return r.map(csvCell).join(',')}).join('\n'))}
  else if(act==='logout'){if(S.token)api('logout').catch(function(){});dropExpo();S.token='';S.me=null;S.ev='';S.ov=null;S.cred=null;S.expoOnly=false;render()}
  else if(act==='copyLink'){var t=$('#linkOut').textContent;try{navigator.clipboard.writeText(t).then(function(){toast('Link copied')},function(){toast(t)})}catch(x){toast(t)}}
  else if(act==='shiftNew'){S.editShift={id:'',role:'',location:'',date:(S.events.find(function(x){return x.id===S.ev})||{}).date||'',start:'05:00',end:'09:00',need:'4',notes:''};render()}
  else if(act==='shiftEdit'){S.editShift=Object.assign({},S.shifts.find(function(s){return s.id===id}));render()}
  else if(act==='shiftCancel'){S.editShift=null;render()}
  else if(act==='shiftDel')run(async function(){await api('removeShift',{id:id});toast('Shift deleted');await reload()});
  else if(act==='vstat')run(async function(){await api('setVolunteerStatus',{id:id,status:b.getAttribute('data-st')});await reload()});
  else if(act==='unassign')run(async function(){await api('unassignShift',{assignId:id});await reload()});
  else if(act==='ciIn'||act==='ciOut'){var code=($('#ciCode').value||'').trim();S.ci=code;if(!code){toast('Type the code first',true);return}
    run(async function(){var r=await api('volunteerCheck',{code:code,action:act==='ciOut'?'out':'in'});S.ci='';toast(r.name+(r.action==='in'?' checked in as ':' checked out ')+(r.action==='in'?r.role:'('+r.hours+' h)'));await reload()})}
  else if(act==='csv'){var rows=[['Name','Mobile','Email','Club','Status','Code','Hours','Shifts']].concat(S.vols.map(function(v){return [v.name,v.phone,v.email,v.club,v.status,v.code,v.hours,v.shifts.map(function(s){return s.role+' '+s.date+' '+s.start}).join('; ')]}));download('volunteers.csv',rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'))}
  else if(act==='runStep'){var it=S.run.find(function(r){return r.id===id});var nx={todo:'doing',doing:'done',done:'todo'}[it.status];run(async function(){await api('saveRunItem',{id:id,time:it.time,what:it.what,owner:it.owner,status:nx});await reload()})}
  else if(act==='runDel')run(async function(){await api('removeRunItem',{id:id});await reload()});
  else if(act==='groupAdd'){var d=document.createElement('div');d.innerHTML=groupRow({label:'',finish:'',need:2});$('#groupRows').appendChild(d.firstChild)}
  else if(act==='groupDel'){var r=b.closest('.gr');if(r)r.remove()}
  else if(act==='pacerEdit'){S.editPacer=Object.assign({},S.pace.pacers.find(function(p){return p.id===id}));render();var f=$('#pacerForm');if(f&&f.scrollIntoView)f.scrollIntoView({block:'center'})}
  else if(act==='pacerCancel'){S.editPacer=null;render()}
  else if(act==='pacerDel')run(async function(){await api('removePacer',{id:id});await reload()});
  else if(act==='checkDel')run(async function(){await api('removeCheck',{id:id});await reload()});
  else if(act==='evEdit'){S.editEvent=Object.assign({},S.events.find(function(x){return x.id===id}));render()}
  else if(act==='evNew'){S.editEvent=null;render()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='evPick'){S.ev=t.value;try{localStorage.setItem('rd.ev',S.ev)}catch(x){}S.ov=null;loadTab()}
  else if(t.id==='volF'){S.volF=t.value;render()}
  else if(t.id==='regQ'){}
  else if(t.id==='qF'){S.qF=t.value;render()}
  else if(t.id==='logF'){S.logFilter=t.value;render()}
  else if(t.id==='baseUrl'){S.base=t.value.trim()||S.base;try{localStorage.setItem('rd.base',S.base)}catch(x){}render()}
  else if(t.getAttribute('data-act')==='assign'&&t.value){var sid=t.value,vid=t.getAttribute('data-vid');run(async function(){await api('assignShift',{volunteerId:vid,shiftId:sid});await loadTab()})}
  else if(t.getAttribute('data-act')==='tick'){var id=t.getAttribute('data-id'),on=t.checked;run(async function(){await api('toggleCheck',{id:id,done:on});S.checks=(await api('listChecklist')).items;render()}).then(function(){if(!S.busy)return});}
});
document.addEventListener('input',function(e){if(e.target.id==='regQ'){S.regQ=e.target.value;var p2=e.target.selectionStart;render();var e2=$('#regQ');if(e2){e2.focus();try{e2.setSelectionRange(p2,p2)}catch(x){}}}if(e.target.id==='volQ'){S.volQ=e.target.value;var pos=e.target.selectionStart;render();var el=$('#volQ');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,id=f.id,d=formData(f);
  if(id==='loginForm'){S.loginErr='';run(async function(){
    var u0=d.lgUser||$('#lgUser').value,p0=$('#lgPass').value;
    try{var r=await api('login',{username:u0,password:p0,token:''});S.token=r.token;S.me=r;S.cred=EXPO_SRC&&r.role==='director'?{u:u0,p:p0}:null;await afterLogin()}
    catch(x){
      // A correct login that has no Director role is an Expo desk login: send it straight to the Expo desk.
      if(x.message==='not_allowed'&&EXPO_SRC){S.cred={u:u0,p:p0};S.me={name:u0,role:'desk'};S.expoOnly=true;render();return}S.loginErr=msg(x.message);var el=$('#lgErr');if(el)el.textContent=S.loginErr;toast(S.loginErr,true)}})}
  else if(id==='setupForm'){run(async function(){try{var r=await api('ensureSetup',{key:$('#suKey').value,username:$('#suUser').value,password:$('#suPass').value,token:''});$('#suMsg').textContent=r.summary}catch(x){$('#suMsg').textContent=x.message}})}
  else if(id==='shiftForm')run(async function(){await api('saveShift',Object.assign({id:S.editShift.id||undefined},d));S.editShift=null;toast('Shift saved');await loadTab()});
  else if(id==='addVol')run(async function(){var r=await api('addVolunteer',d);toast('Added. Code '+r.code);await loadTab()});
  else if(id==='runForm')run(async function(){await api('saveRunItem',d);await loadTab()});
  else if(id==='logForm')run(async function(){await api('addLog',d);await loadTab()});
  else if(f.classList.contains('closeForm'))run(async function(){await api('closeLog',{id:f.getAttribute('data-id'),resolution:d.resolution});await loadTab()});
  else if(id==='groupForm')run(async function(){var groups=Array.prototype.map.call(f.querySelectorAll('.gr'),function(r){return {label:r.querySelector('[name=label]').value,finish:r.querySelector('[name=finish]').value,need:r.querySelector('[name=need]').value}});await api('savePaceGroups',{groups:groups,distanceKm:d.distanceKm});toast('Pace groups saved');await loadTab()});
  else if(id==='pacerForm')run(async function(){await api('savePacer',Object.assign({id:S.editPacer&&S.editPacer.id||undefined},d));S.editPacer=null;toast('Pacer saved');await loadTab()});
  else if(id==='linkForm')run(async function(){await api('linkWixEvent',{wixEventId:d.wixEventId});toast('Linked');await loadTab()});
  else if(id==='mapForm')run(async function(){await api('saveWixMap',{map:d});toast('Saved. Press Import / refresh to apply it.');S.wixForm=await api('wixFormFields');await loadTab()});
  else if(id==='ruleForm')run(async function(){var r=await api('saveQualRules',{rules:textToRules(d.rules)});toast('Rules saved ('+r.count+')');await loadTab()});
  else if(f.classList.contains('claimForm'))run(async function(){await api('saveQualClaim',{runnerId:f.getAttribute('data-rid'),text:d.text,km:d.km,time:d.time,link:d.link});toast('Claim saved');await loadTab()});
  else if(id==='checkForm')run(async function(){await api('addCheck',d);await loadTab()});
  else if(id==='eventForm')run(async function(){var r=await api('saveEvent',Object.assign({id:S.editEvent&&S.editEvent.id||undefined},d));S.editEvent=null;toast('Race saved');S.ev=r.event.id;await loadEvents();S.ev=r.event.id;await loadTab()});
});
render();
})();
</script>
</body>
</html>
