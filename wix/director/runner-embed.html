<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find your bib, start time and result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f6fb;--surface:#ffffff;--surface-2:#f1f5fb;--line:#e2e8f2;--ink:#0f1b33;--ink-2:#5b6b85;--primary:#1558e8;--on-primary:#ffffff;--navy:#0a1f4f;--navy-2:#12306f;--good:#12803d;--warn:#b45309;--bad:#c0261c;--good-bg:#ddf5e6;--warn-bg:#fef0d0;--bad-bg:#fde3e0;--info-bg:#e4edff;--f-display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a1226;--surface:#111c36;--surface-2:#16233f;--line:#243457;--ink:#e8eefb;--ink-2:#9fb0d0;--primary:#5b8dff;--on-primary:#06122b;--navy:#060d1f;--navy-2:#0e1c3d;--good:#4cc77a;--warn:#f0a640;--bad:#ff8a80;--good-bg:#12331f;--warn-bg:#3a2a0d;--bad-bg:#3d1a17;--info-bg:#172a52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:4px 0 0;font:700 clamp(28px,7vw,40px)/1.08 var(--f-display);letter-spacing:-.01em}
h2{margin:0;font:700 20px/1.15 var(--f-display)}
.muted{color:var(--ink-2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(15,27,51,.04),0 4px 14px rgba(15,27,51,.04)}
.note{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--info-bg);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font:600 14px var(--f-body);color:var(--ink-2)}
label.f input{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:48px;font-size:17px;font-weight:400;color:var(--ink)}
input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.btn{display:inline-block;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:600 16px var(--f-display);min-height:46px;padding:0 18px;cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:100%;margin-top:12px;font-size:18px;letter-spacing:.02em}
.btn.alt{background:var(--info-bg);border-color:transparent;color:var(--primary);margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}
.err{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.pill{display:inline-block;font:700 12px var(--f-body);padding:3px 9px;border-radius:99px;background:var(--info-bg);color:var(--primary)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pick{display:block;width:100%;text-align:left;margin-top:10px}
.runner{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:12px}
.bibno{flex:none;min-width:84px;text-align:center;font:800 28px/1 var(--f-display);padding:14px 8px;border-radius:10px;background:var(--navy);color:#fff;letter-spacing:.02em;word-break:break-all}
.who{min-width:0;flex:1}
.who h2{word-break:break-word}
.cells{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cell{padding:8px 12px;border:1px solid var(--line);border-radius:10px;min-width:92px;background:var(--surface-2)}
.cell b{display:block;font:700 18px/1.1 var(--f-display)}
.cell small{display:block;color:var(--ink-2);font-size:12px}
.time{font:800 32px/1 var(--f-display);margin-top:10px;letter-spacing:-.01em}
.start{margin:8px 0 0}
.pv{overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:8px;margin-top:10px}
.pv iframe{display:block;border:0;background:#fff;transform-origin:0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.row .btn{margin-top:0}
@media (max-width:420px){.runner{flex-direction:column}.bibno{min-width:0;width:100%;text-align:left;padding:10px 14px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var ERR={not_published:'That race is not showing anything on this page. Please check the link.',bad_query:'Please type your bib number, or at least three letters of your name.',no_certificate:'There is no certificate for that bib.',timeout:'There was no answer in time. Please try again.',page_code_old:'This page is being updated. Please try again in a few minutes.',backend_old:'This page is being updated. Please try again in a few minutes.'};
var msg=function(e){return ERR[e]||'Something went wrong. Please try again in a moment.'};
var STATUS={dnf:'Did not finish',dns:'Did not start',dsq:'Disqualified'};
var S={ev:'',races:null,info:null,q:'',res:null,err:'',busy:false,cert:null,certErr:''};
var pending={},seq=0;
window.addEventListener('message',function(e){
  var m=e.data;if(!m||typeof m!=='object')return;
  if(m.kind==='init'){var ev=typeof m.ev==='string'?m.ev:'';if(ev!==S.ev||!booted){S.ev=ev;S.info=null;S.races=null;S.err='';booted=false;boot()}return}
  if(m.kind!=='result'||!pending[m.id])return;
  var p=pending[m.id];delete pending[m.id];clearTimeout(p.t);
  if(m.ok)p.res(m.result);else p.rej(new Error(m.error||'failed'));
});
function api(method,arg){return new Promise(function(res,rej){var id=++seq;var t=setTimeout(function(){delete pending[id];rej(new Error('timeout'))},30000);pending[id]={res:res,rej:rej,t:t};window.parent.postMessage({kind:'call',id:id,method:method,arg:arg||{}},'*')})}
var booted=false;
async function boot(){
  if(booted&&(S.info||S.races))return;booted=true;
  try{
    if(!S.ev){var r=await api('pubRaces');S.races=r.races;if(r.races.length===1)S.ev=r.races[0].id;else{S.err='';render();return}}
    S.info=await api('pubFind',{ev:S.ev,q:''});S.err='';
  }catch(x){
    S.err=msg(x.message);
    if(x.message==='not_published'){S.ev='';try{S.races=(await api('pubRaces')).races}catch(y){S.races=[]}}
  }
  render();
}
function fdate(d){var x=new Date(d+'T00:00:00');return isNaN(x)?String(d||''):x.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function ord(n){n=Number(n);var t=n%100,u=n%10;return n+((t>=11&&t<=13)?'th':u===1?'st':u===2?'nd':u===3?'rd':'th')}
function cell(big,small){return '<div class="cell"><b>'+esc(big)+'</b><small>'+esc(small)+'</small></div>'}
function resultHtml(r){
  if(r.status!=='fin')return '<p style="margin-top:10px"><span class="pill warn">'+esc(STATUS[r.status]||'No time recorded')+'</span></p>';
  return '<div class="time" aria-label="Finish time">'+esc(r.time)+'</div><div class="cells">'
    +(r.place?cell(ord(r.place),'in category'):'')+(r.gplace&&r.gender?cell(ord(r.gplace),r.gender):'')+(r.aplace&&r.ageGroup?cell(ord(r.aplace),r.ageGroup+' age group'):'')+'</div>';
}
function itemHtml(it,f){
  var h='<article class="runner"><div class="bibno" aria-label="Bib number">'+esc(it.bib)+'</div><div class="who"><h2>'+esc(it.name)+'</h2><p class="muted">'+esc(it.cat)+'</p>';
  if(it.start)h+='<p class="start"><b>Start '+esc(it.start.start)+'</b>'+(it.start.wave?' · '+esc(it.start.wave):'')+(it.start.corral?' · Corral '+esc(it.start.corral):'')+'</p>';
  else if(f.startList&&!it.result)h+='<p class="muted start">Your start time has not been announced yet.</p>';
  if(it.result)h+=resultHtml(it.result);
  if(it.cert)h+='<button class="btn alt" type="button" data-cert="'+esc(it.bib)+'">Your certificate</button>';
  return h+'</div></article>';
}
function resultsHtml(){
  var r=S.res;if(!r)return '';
  if(r.err)return '<div class="err" role="alert">'+esc(r.err)+'</div>';
  var f=S.info.flags;
  if(r.tooShort)return '<p class="muted" style="margin-top:14px">'+(/^\d+$/.test(r.q)?'Nobody with that bib number is shown here.':'Please type at least three letters of your name, or your bib number.')+'</p>';
  if(!r.items.length)return '<p class="muted" style="margin-top:14px">Nobody found for “'+esc(r.q)+'”. Check the spelling, or try your bib number.</p>';
  return r.items.map(function(it){return itemHtml(it,f)}).join('')+(r.more?'<p class="muted" style="margin-top:12px">These are the first ten. Type more of the name to narrow it down.</p>':'');
}
// the real size of the certificate, shrunk to the width of the screen
function certNat(html){var m=/@page\{size:(\d+)mm (\d+)mm/.exec(html||''),w=m?+m[1]:297,h=m?+m[2]:210,k=3.7795;return {w:Math.round((w+12)*k),h:Math.round((h+18)*k)}}
function certHtml(){
  var c=S.cert;if(S.certErr)return '<div class="err" role="alert">'+esc(S.certErr)+'</div>';if(!c)return '';
  var nat=certNat(c.html),avail=($('#app')&&$('#app').clientWidth-34)||640,s=Math.min(1,avail/nat.w);
  return '<div class="card" id="certCard"><h2>Certificate for '+esc(c.name)+'</h2><div class="pv" style="height:'+Math.ceil(nat.h*s)+'px"><iframe id="certFr" title="Your certificate" sandbox="" style="width:'+nat.w+'px;height:'+nat.h+'px;transform:scale('+s+')" srcdoc="'+esc(c.html)+'"></iframe></div>'
    +'<div class="row"><button class="btn pri" type="button" data-act="print" style="width:auto;margin-top:0">Print or save as PDF</button><button class="btn" type="button" data-act="close">Close</button></div></div>';
}
function paint(){var a=$('#results'),b=$('#certBox'),g=$('#go');if(a)a.innerHTML=resultsHtml();if(b)b.innerHTML=certHtml();if(g)g.disabled=S.busy}
function render(){
  var app=$('#app');
  if(!S.info){
    if(S.err||(S.races&&!S.ev)){
      var lst=(S.races||[]).map(function(r){return '<button class="btn pick" type="button" data-ev="'+esc(r.id)+'">'+esc(r.name)+(r.date?' · '+esc(fdate(r.date)):'')+'</button>'}).join('');
      app.innerHTML='<div class="eyebrow">VTRA</div><h1>Find your bib and result</h1>'+(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')
        +(lst?'<div class="card"><h2>Races on this page</h2>'+lst+'</div>':(S.races?'<p class="muted" style="margin-top:14px">No race is showing anything here at the moment.</p>':''));
      return;
    }
    app.innerHTML='<p class="muted">Loading…</p>';return;
  }
  var i=S.info,f=i.flags;
  app.innerHTML='<div class="eyebrow">VTRA</div><h1>'+esc(i.race.name)+'</h1><p class="muted" style="margin-top:6px">'+esc(fdate(i.race.date))+(i.race.venue?' · '+esc(i.race.venue):'')+'</p>'
    +(i.note?'<div class="note" role="note">'+esc(i.note)+'</div>':'')
    +'<form id="findForm" class="card" novalidate><label class="f">Your bib number or name<input id="q" name="q" value="'+esc(S.q)+'" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-describedby="hint"></label>'
    +'<p class="muted" id="hint" style="margin-top:6px">'+(f.results&&f.startList?'See your start time and your result.':f.results?'See your result.':'See your start time.')+' Type your bib number, or at least three letters of your name.</p>'
    +'<button class="btn pri" id="go" type="submit"'+(S.busy?' disabled':'')+'>Find me</button></form>'
    +'<div id="results" role="region" aria-live="polite" aria-label="Search results">'+resultsHtml()+'</div><div id="certBox">'+certHtml()+'</div>'
    +(f.results?'<p class="muted" style="margin-top:18px">Results can take up to 30 seconds to show a correction.</p>':'');
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-ev],[data-cert],[data-act]');if(!b)return;
  if(b.hasAttribute('data-ev')){S.ev=b.getAttribute('data-ev');S.err='';S.info=null;S.races=null;booted=false;boot();return}
  if(b.hasAttribute('data-cert')){openCert(b.getAttribute('data-cert'));return}
  var act=b.getAttribute('data-act');
  if(act==='close'){S.cert=null;S.certErr='';paint()}
  else if(act==='print'&&S.cert)printHtml(S.cert.html);
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='q')S.q=e.target.value});
document.addEventListener('submit',async function(e){
  e.preventDefault();var f=e.target;if(!f||f.id!=='findForm'||S.busy)return;
  var q=String(f.elements.q.value||'').trim();S.q=q;S.cert=null;S.certErr='';
  if(!q){S.res={q:q,err:msg('bad_query')};paint();return}
  S.busy=true;paint();
  try{var r=await api('pubFind',{ev:S.ev,q:q});S.info.note=r.note;S.info.flags=r.flags;S.res={q:q,items:r.items,more:r.more,tooShort:r.tooShort}}
  catch(x){S.res={q:q,err:msg(x.message)}}
  S.busy=false;paint();
  var first=$('#results article');if(first&&first.scrollIntoView)try{first.scrollIntoView({block:'nearest'})}catch(y){}
});
async function openCert(bib){
  if(S.busy)return;S.busy=true;S.certErr='';paint();
  try{S.cert=await api('pubCert',{ev:S.ev,bib:bib})}catch(x){S.cert=null;S.certErr=msg(x.message)}
  S.busy=false;paint();
  var c=$('#certCard');if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'nearest'})}catch(y){}
}
function printHtml(html){try{var f=document.createElement('iframe');f.setAttribute('style','position:fixed;right:0;bottom:0;width:0;height:0;border:0');f.setAttribute('aria-hidden','true');document.body.appendChild(f);var w=f.contentWindow,d=w.document;d.open();d.write(html);d.close();setTimeout(function(){try{w.focus();w.print()}catch(x){}setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f)},3000)},150)}catch(x){}}
window.parent.postMessage({kind:'hello'},'*');
setTimeout(function(){if(!booted)boot()},1200);
render();
})();
</script>
<script>
/* Tells the Wix page how tall this content is, so the page can resize the embed (no inner scrollbar). */
(function(){var last=0,t;
function h(){var r=0;[].forEach.call(document.body.children,function(el){if(el.tagName==='SCRIPT'||el.hidden||getComputedStyle(el).position==='fixed')return;var q=el.getBoundingClientRect();if(q.height>0)r=Math.max(r,q.bottom+(window.pageYOffset||0))});return Math.ceil(r)+8}
function send(){var v=h();if(Math.abs(v-last)>2){last=v;try{window.parent.postMessage({kind:'resize',height:v},'*')}catch(e){}}}
if(window.ResizeObserver){try{new ResizeObserver(function(){clearTimeout(t);t=setTimeout(send,60)}).observe(document.body)}catch(e){}}
window.addEventListener('load',send);setInterval(send,1000);setTimeout(send,50);
})();
</script>
</body>
</html>
