<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f6fb;--surface:#ffffff;--surface-2:#f1f5fb;--line:#e2e8f2;--ink:#0f1b33;--ink-2:#5b6b85;--primary:#1558e8;--on-primary:#ffffff;--navy:#0a1f4f;--navy-2:#12306f;--good:#12803d;--warn:#b45309;--bad:#c0261c;--good-bg:#ddf5e6;--warn-bg:#fef0d0;--bad-bg:#fde3e0;--info-bg:#e4edff;--f-display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a1226;--surface:#111c36;--surface-2:#16233f;--line:#243457;--ink:#e8eefb;--ink-2:#9fb0d0;--primary:#5b8dff;--on-primary:#06122b;--navy:#060d1f;--navy-2:#0e1c3d;--good:#4cc77a;--warn:#f0a640;--bad:#ff8a80;--good-bg:#12331f;--warn-bg:#3a2a0d;--bad-bg:#3d1a17;--info-bg:#172a52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h2,h3,p{margin:0}
small,.muted{font-size:13px;color:var(--ink-2)}
[hidden]{display:none!important}
.app{max-width:1180px;margin-inline:auto;padding:0 16px 56px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.between{justify-content:space-between}
.eyebrow{font:600 13px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:3px 0 0;font:700 clamp(24px,5vw,34px)/1.05 var(--f-display)}
h2{font:700 24px/1.1 var(--f-display);letter-spacing:.01em}
h3{font:700 18px/1.2 var(--f-display);letter-spacing:.02em}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
.tab{border:0;background:none;padding:10px 14px;font:700 17px var(--f-display);letter-spacing:.04em;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi .n{font:700 38px/1 var(--f-display)}
.kpi .l{font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font:700 12px var(--f-body);padding:3px 9px;border-radius:99px;background:var(--info-bg);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-height:38px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font:600 13px var(--f-body);color:var(--ink-2)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.scroll{overflow-x:auto}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--info-bg);margin-top:8px}
.alert.warn{background:var(--warn-bg)}.alert.bad{background:var(--bad-bg)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:380px;margin:12vh auto 0}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.short{color:var(--bad);font-weight:700}
.sec{margin-top:6px;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--surface-2)}
.chk input{margin-top:3px;min-height:0;width:18px;height:18px}
.chk.done span{text-decoration:line-through;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:14px}
/*raceos-theme*/
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em}
h1{font-weight:700}h2{font-size:22px;font-weight:700}h3{font-size:16px;font-weight:700}
.eyebrow{font:600 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.card{border-radius:14px;border-color:var(--line);box-shadow:0 1px 2px rgba(15,27,51,.04),0 4px 14px rgba(15,27,51,.04)}
.btn{border-radius:9px;font-weight:600;border-color:var(--line)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn.alt{background:var(--info-bg);border-color:transparent;color:var(--primary)}
.pill{background:var(--info-bg);color:var(--primary)}
.kpi .n{font:700 30px/1.05 var(--f-display);letter-spacing:-.02em}
.kpi .l{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:none;color:var(--ink-2)}
.bar i{background:var(--primary)}
th{font:600 11px var(--f-display);letter-spacing:.07em;color:var(--ink-2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.tab[aria-selected=true]{border-bottom-color:var(--primary)}

.app.wide{max-width:none;padding:0}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#c9d5f0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px;color:#fff;font:800 20px var(--f-display);letter-spacing:-.02em}
.brand svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orgname{padding:0 8px 12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:4px;color:#fff;font:700 13px var(--f-display)}
.orgname small{display:block;color:#8ea2cf;font-weight:500;font-size:11px;margin-top:2px}
.navgrp{margin:12px 8px 2px;font:700 10px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#6f86b8}
.side .tabs{display:flex;flex-direction:column;gap:2px;margin:0;overflow:visible}
.side .tab{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;color:#c9d5f0;font:600 14px var(--f-display);text-align:left;letter-spacing:0;white-space:normal}
.side .tab:hover{background:rgba(255,255,255,.07)}
.side .tab[aria-selected=true]{background:var(--primary);color:#fff;border:0}
.side .tab svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;min-height:64px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:20px;margin:2px 0 0}
.content{padding:20px 24px 56px;max-width:1320px}
.userchip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 14px var(--f-display)}
.who{line-height:1.15;font:600 13px var(--f-display)}.who small{display:block;font-weight:500}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.bell svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-body);text-align:center;padding:0 4px}
.hero{border-radius:16px;color:#fff;padding:26px;min-height:150px;background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 55%,#2a5bd7 100%);background-size:cover;background-position:center;margin-bottom:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero .tag{align-self:flex-start;background:#12803d;color:#fff;border-radius:6px;padding:3px 9px;font:700 11px var(--f-display)}
.hero h2{font-size:30px;color:#fff;letter-spacing:-.02em}.hero small{color:#d8e3ff;font-size:14px}
.ico{width:40px;height:40px;border-radius:50%;background:var(--info-bg);color:var(--primary);display:grid;place-items:center;margin-bottom:8px}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#expoWrap:not([hidden]){position:fixed;top:64px;left:248px;right:0;bottom:0;padding:16px 24px;overflow:auto;z-index:5;background:var(--bg)}
.loginwrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--navy),var(--navy-2));padding:16px}
.loginwrap .login{margin:0;width:100%;max-width:400px;background:var(--surface);color:var(--ink);border-radius:16px;padding:26px}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding:8px;gap:4px}
 .brand,.orgname,.navgrp{display:none}
 .side .tabs{flex-direction:row;gap:4px}.side .tab{white-space:nowrap}
 .topbar{position:static;padding:10px 14px}.content{padding:14px 14px 56px}
 #expoWrap:not([hidden]){position:static;padding:0 14px 56px}
}
</style>
</head>

orm\" autocomplete=\"off\">\n        <p class=\"note\" style=\"margin:8px 0 12px\">Creates the database and the first admin login. Needs the setup key you put in <b>expo.web.js<\/b>.<\/p>\n        <div class=\"field\"><label for=\"fsKey\">Setup key<\/label><input id=\"fsKey\" type=\"password\" autocomplete=\"off\"><\/div>\n        <div class=\"field\"><label for=\"fsUser\">Admin username<\/label><input id=\"fsUser\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\"><\/div>\n        <div class=\"field\"><label for=\"fsPass\">Admin password<\/label><input id=\"fsPass\" type=\"password\" autocomplete=\"new-password\"><\/div>\n        <div class=\"row\"><button type=\"submit\" class=\"btn\">Create database<\/button><span class=\"msg\" id=\"fsMsg\"><\/span><\/div>\n      <\/form>\n    <\/details>\n  <\/div>\n<\/div>\n<div class=\"app\" id=\"app\" hidden>\n  <header class=\"top\">\n    <div class=\"top-row\">\n      <div class=\"brand\">\n        <div class=\"eyebrow\">Expo desk<\/div>\n        <h1 id=\"evName\">Race expo<\/h1>\n      <\/div>\n      <div class=\"tools\">\n        <label class=\"deskin\" for=\"raceSel\">Race <select id=\"raceSel\" aria-label=\"Race\"><option value=\"\">Loading…<\/option><\/select><\/label>\n        <label class=\"deskin\" for=\"deskName\">Desk <input id=\"deskName\" readonly type=\"text\" maxlength=\"20\" placeholder=\"Desk 1\" autocomplete=\"off\"><\/label>\n        <span class=\"live wait\" id=\"live\"><span class=\"dot\"><\/span><span id=\"liveTxt\">Connecting<\/span><\/span>\n        <button type=\"button\" class=\"btn sm\" data-act=\"change-desk\">Change race or desk<\/button><button type=\"button\" class=\"btn sm\" data-act=\"logout\">Log out<\/button>\n      <\/div>\n    <\/div>\n    <nav class=\"tabs\" role=\"tablist\" aria-label=\"Sections\">\n      <button type=\"button\" role=\"tab\" id=\"t-desk\" data-act=\"tab\" data-tab=\"desk\" aria-selected=\"true\">Desk<\/button>\n      <button type=\"button\" role=\"tab\" id=\"t-stock\" data-act=\"tab\" data-tab=\"stock\" aria-selected=\"false\">Stock<\/button>\n      <button type=\"button\" role=\"tab\" id=\"t-log\" data-act=\"tab\" data-tab=\"log\" aria-selected=\"false\">Log<\/button>\n      <button type=\"button\" role=\"tab\" id=\"t-setup\" data-act=\"tab\" data-tab=\"setup\" aria-selected=\"false\">Setup<\/button>\n    <\/nav>\n  <\/header>\n\n  <div class=\"banner\" id=\"banner\" hidden><\/div>\n\n  <section id=\"tab-desk\" aria-labelledby=\"t-desk\">\n    <div class=\"desk\">\n      <div>\n        <label class=\"searchbox\" for=\"q\"><span class=\"lbl\">Find runner<\/span>\n          <input id=\"q\" type=\"search\" inputmode=\"search\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"Bib number, name, phone or email\">\n        <\/label>\n        <div id=\"results\"><\/div>\n        <div id=\"panel\"><\/div>\n      <\/div>\n      <aside id=\"rail\" aria-label=\"Live stock\"><\/aside>\n    <\/div>\n  <\/section>\n\n  <section id=\"tab-stock\" aria-labelledby=\"t-stock\" hidden><div id=\"lotHolder\" style=\"margin-bottom:16px\"><div class=\"card\" id=\"cfgCard\">\n          <h2 class=\"h\">Stock lot: enter what you received<\/h2>\n          <div class=\"field\"><label for=\"cfgName\">Race name shown to everyone<\/label><input id=\"cfgName\" type=\"text\" maxlength=\"40\" placeholder=\"e.g. Vizag Half Marathon\"><small class=\"note\" id=\"cfgNameNote\"><\/small><\/div>\n          <div class=\"field\"><label for=\"cfgBib\">Bibs in lot<\/label><input id=\"cfgBib\" type=\"number\" min=\"0\" inputmode=\"numeric\"><\/div>\n          <fieldset><legend>T-shirts in lot, by size<\/legend><div class=\"sizegrid\" id=\"cfgSizes\"><\/div><\/fieldset>\n          <div class=\"row\"><button type=\"button\" class=\"btn primary\" id=\"saveCfg\" data-act=\"save-cfg\">Save lot<\/button><span class=\"msg\" id=\"cfgMsg\"><\/span><\/div>\n          <p class=\"note\" style=\"margin-top:12px\">This is the only thing you type in. Every bib and T-shirt handed over at a desk is deducted automatically, and the stock left updates on all desks.<\/p>\n        <\/div><\/div><div id=\"stockBody\"><\/div><\/section>\n  <section id=\"tab-log\" aria-labelledby=\"t-log\" hidden><\/section>\n\n  <section id=\"tab-setup\" aria-labelledby=\"t-setup\" hidden>\n    <div class=\"cols\">\n      <div>\n        <div class=\"card\" id=\"raceCard\">\n          <h2 class=\"h\">Races<\/h2>\n          <p class=\"note\" id=\"raceInfo\">Races come from your findmybib collections.<\/p>\n          <p class=\"note\" style=\"margin-top:8px\">Every collection whose ID starts with <b>Import<\/b> is a race, named after the collection's display name in the Wix CMS (Import910 is VHM). To add a race, upload its list to a new collection such as ImportUltribe with the display name Ultribe, then press Refresh.<\/p>\n          <div class=\"row\"><button type=\"button\" class=\"btn\" id=\"refreshRaces\" data-act=\"refresh-races\">Refresh races<\/button><span class=\"msg\" id=\"raceMsg\"><\/span><\/div>\n        <\/div>\n        <div class=\"card\" id=\"sampleCard\" hidden>\n          <h2 class=\"h\">Sample data<\/h2>\n          <p class=\"note\">Load 20 example runners to try the desk, then remove them before the expo opens. Example runners are never mixed into your real list.<\/p>\n          <div class=\"row\"><button type=\"button\" class=\"btn\" id=\"loadSample\" data-act=\"load-sample\">Load sample runners<\/button><button type=\"button\" class=\"btn\" id=\"rmSample\" data-act=\"rm-sample\">Remove sample data<\/button><span class=\"msg\" id=\"rmMsg\"><\/span><\/div>\n        <\/div>\n      <\/div>\n      <div>\n        <div class=\"card\" id=\"fmbCard\">\n          <h2 class=\"h\">Sync runners from findmybib<\/h2>\n          <p class=\"note\">Copies the runners in the selected race's findmybib collection into the expo list. Safe to repeat any time; it adds new runners and updates details, and never changes what has been handed over.<\/p>\n          <div class=\"row\"><button type=\"button\" class=\"btn\" id=\"fmbCheck\" data-act=\"fmb-preview\">Check data<\/button><button type=\"button\" class=\"btn primary\" id=\"fmbSync\" data-act=\"fmb-sync\" disabled>Sync runners<\/button><span class=\"msg\" id=\"fmbMsg\"><\/span><\/div>\n          <pre id=\"fmbInfo\" class=\"note\" hidden style=\"white-space:pre-wrap;margin-top:10px\"><\/pre>\n        <\/div>\n        <details class=\"more\"><summary>Other ways to add runners (CSV, one at a time, sample data)<\/summary>\n        <div class=\"card\" id=\"impCard\">\n          <h2 class=\"h\">Import runners<\/h2>\n          <p class=\"note\" style=\"margin-bottom:10px\">Paste rows from Excel or load a CSV. Columns: bib, name, category, T-shirt size, phone. A header row is detected. Only new runners are added. Registered runners are never changed, their T-shirt size included. Only the findmybib sync updates registration details, and your findmybib collection itself is never written to.<\/p>\n          <textarea id=\"csv\" rows=\"6\" spellcheck=\"false\" placeholder=\"bib,name,category,size,phone\"><\/textarea>\n          <div class=\"row\"><input id=\"csvFile\" type=\"file\" accept=\".csv,.tsv,.txt\" aria-label=\"Choose a CSV file\"><\/div>\n          <div class=\"row\"><button type=\"button\" class=\"btn primary\" id=\"doImport\" data-act=\"import\" disabled>Import<\/button><span class=\"msg\" id=\"impInfo\">Nothing to import yet.<\/span><\/div>\n          <div class=\"progress\" id=\"impProg\" hidden><i><\/i><\/div>\n        <\/div>\n        <div class=\"card\">\n          <h2 class=\"h\">Add one runner<\/h2>\n          <form id=\"addForm\" autocomplete=\"off\">\n            <div class=\"formgrid\">\n              <div class=\"field\"><label for=\"addBib\">Bib<\/label><input id=\"addBib\" type=\"text\" maxlength=\"12\" required><\/div>\n              <div class=\"field\"><label for=\"addName\">Name<\/label><input id=\"addName\" type=\"text\" maxlength=\"60\" required><\/div>\n              <div class=\"field\"><label for=\"addCat\">Category<\/label><input id=\"addCat\" type=\"text\" maxlength=\"20\" list=\"catList\" placeholder=\"21K\"><\/div>\n              <div class=\"field\"><label for=\"addSize\">T-shirt size<\/label><select id=\"addSize\"><\/select><\/div>\n              <div class=\"field\"><label for=\"addPhone\">Phone<\/label><input id=\"addPhone\" type=\"text\" inputmode=\"tel\" maxlength=\"20\"><\/div>\n            <\/div>\n            <datalist id=\"catList\"><\/datalist>\n            <div class=\"row\"><button type=\"submit\" class=\"btn primary\" id=\"addBtn\">Add runner<\/button><span class=\"msg\" id=\"addMsg\"><\/span><\/div>\n          <\/form>\n        <\/div>\n        <\/details>\n        <div class=\"card\" id=\"prepCard\">\n          <h2 class=\"h\">Staff logins<\/h2>\n          <p class=\"note\">Logins are kept in the Wix CMS, in the <b>ExpoStaff<\/b> collection. Add one row per person: <b>username<\/b>, <b>password<\/b>, <b>role<\/b> (admin or desk). The three desks are fixed in the software: Desk 1 - BIB, Desk 2 - Tshirt, Desk 3 - Misc. Leave <b>desk<\/b> empty to let that login choose any desk, or enter 1, 2 or 3 (several separated by commas) to limit it. Delete the row to remove access.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h2 class=\"h\">Export<\/h2>\n          <div class=\"row\"><button type=\"button\" class=\"btn\" data-act=\"export-roster\">Runners and status (CSV)<\/button><button type=\"button\" class=\"btn\" data-act=\"export-stock\">Stock summary (CSV)<\/button><\/div>\n          <p class=\"msg\" id=\"expMsg\" style=\"margin-top:10px\"><\/p>\n          <textarea id=\"expText\" rows=\"6\" readonly hidden aria-label=\"Exported CSV text\"><\/textarea>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\" hidden><\/div>\n<input type=\"file\" id=\"pkFile\" accept=\"image/*\" capture=\"user\" hidden>\n\n<script>\n(function(){\n'use strict';\nvar SIZES=['XS','S','M','L','XL','XXL'];\nvar nf=new Intl.NumberFormat('en-IN');\nvar $=function(s,r){return (r||document).querySelector(s)};\nvar n=function(x){return nf.format(x)};\nfunction esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})}\nfunction sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}\n\nvar S={tab:'desk',q:'',sel:null,pick:{check:true,bib:true,shirt:true,size:null},runners:[],byId:new Map(),\n  cfg:{name:'',bibLot:0,shirtLot:{},example:false},token:'',me:null,ev:'',events:[],live:false,err:null,canWrite:false,canAdmin:false,since:'',label:'',notStaff:false,setup:false,ready:false,\n  desk:'',busy:false,lastOp:null,armed:null,D:null,imp:null,cfgDirty:false,importing:false,pickups:{}};\nfunction newPickup(){return {by:'self',friendName:'',friendPhone:'',selfie:''}}\nS.pickup=newPickup();\n\n/* ---------- helpers ---------- */\nfunction docId(b){var s=String(b).trim().replace(/[^A-Za-z0-9_\\-.~:@+]/g,'-').slice(0,100);return (s==='.'||s==='..'||!s)?'x'+s:s}\nvar DESK_FOR={check:'Desk 1 - BIB',bib:'Desk 1 - BIB',shirt:'Desk 2 - Tshirt'};\nfunction canDo(kind,item){var c=S.me&&S.me.can;if(!c)return false;if(kind==='addRunner')return !!c.addRunner;return (c[kind]||[]).indexOf(item)>=0}\nfunction defaultPick(r){return {check:!!r&&!r.checkedIn&&canDo('give','check'),bib:!!r&&!r.bibIssued&&canDo('give','bib'),shirt:!!r&&!r.shirtIssued&&!!r.size&&canDo('give','shirt'),size:r&&r.size||null}}\nfunction notHere(label,item){return '<div class=\"item notdesk\"><div><b>'+label+'<\/b><small>Not handed over at this desk. Send the runner to '+esc(DESK_FOR[item])+'.<\/small><\/div><\/div>'}\nfunction writable(){return S.canWrite===true&&S.live&&!S.notStaff}\nfunction when(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d))return '';var t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});\n  return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString([], {day:'numeric',month:'short'})+' '+t}\nfunction catNum(cat){var s=String(cat);if(/half/i.test(s))return 21.1;if(/full|marathon/i.test(s))return 42.2;var m=s.match(/(\\d+(\\.\\d+)?)/);return m?parseFloat(m[1]):NaN}\nfunction catColor(cat){var x=catNum(cat);if(isNaN(x))return 'var(--k6)';if(x<=5)return 'var(--k1)';if(x<=10)return 'var(--k2)';if(x<=21.2)return 'var(--k3)';if(x<=42.2)return 'var(--k4)';return 'var(--k5)'}\nfunction setHTML(el,html){\n  if(el._h===html)return;\n  var a=document.activeElement,key=(a&&el.contains(a))?a.getAttribute('data-fk'):null;\n  el.innerHTML=html;el._h=html;\n  if(key){var t=el.querySelector('[data-fk=\"'+key+'\"]');if(t&&!t.disabled)t.focus()}\n}\nfunction normSize(v){\n  var s=String(v||'').trim().toUpperCase().replace(/[\\s\\-_]/g,'');\n  var map={SMALL:'S',MEDIUM:'M',LARGE:'L',XLARGE:'XL',EXTRALARGE:'XL','2XL':'XXL',XXLARGE:'XXL',XSMALL:'XS',EXTRASMALL:'XS'};\n  if(map[s])s=map[s];\n  return SIZES.indexOf(s)>=0?s:''\n}\n\n/* ---------- bridge to the Wix page code ---------- */\nvar pending={},seq=0;\nwindow.addEventListener('message',function(e){\n  var m=e.data;\n  // The Race Director shell logs the person in here with the login they just typed, and logs out with it.\n  if(m&&m.kind==='autologin'&&m.username&&$('#lgUser')&&!S.token){$('#lgUser').value=String(m.username);$('#lgPass').value=String(m.password||'');doLogin({preventDefault:function(){}});return}\n  if(m&&m.kind==='shell-logout'){try{sessionStorage.removeItem('expo-token')}catch(x){}if(S.token)api('logout').catch(function(){});S.token='';return}\n  if(!m||m.kind!=='result'||!pending[m.id])return;\n  var p=pending[m.id];delete pending[m.id];clearTimeout(p.t);\n  if(m.ok)p.res(m.result);else{if((m.error==='not_logged_in'||m.error==='desk_busy')&&S.canWrite)forceLogin(m.error);p.rej(new Error(m.error||'failed'))}\n});\nfunction api(method,arg,ms){\n  return new Promise(function(res,rej){\n    var id=++seq;\n    var t=setTimeout(function(){delete pending[id];rej(new Error('timeout'))},ms||30000);\n    pending[id]={res:res,rej:rej,t:t};\n    var a=Object.assign({ev:S.ev,token:S.token},arg||{});window.parent.postMessage({kind:'call',id:id,method:method,arg:a},'*');\n  });\n}\n\n/* ---------- data in ---------- */\nfunction normRunner(x){\n  var bib=String(x.bib!=null?x.bib:x.id),name=String(x.name||'');\n  return {id:x.id,bib:bib,name:name,bibName:String(x.bibName||''),cat:String(x.cat||''),size:String(x.size||''),phone:String(x.phone||''),email:String(x.email||''),emailL:String(x.email||'').toLowerCase(),example:!!x.example,\n    checkedIn:!!x.checkedIn,checkedInAt:x.checkedInAt||null,checkedInDesk:x.checkedInDesk||'',\n    bibIssued:!!x.bibIssued,bibAt:x.bibAt||null,bibDesk:x.bibDesk||'',\n    shirtIssued:!!x.shirtIssued,shirtSize:x.shirtSize||'',shirtAt:x.shirtAt||null,shirtDesk:x.shirtDesk||'',\n    nameL:name.toLowerCase(),bibL:bib.toLowerCase(),phoneDigits:String(x.phone||'').replace(/\\D/g,''),bibN:parseFloat(bib.replace(/\\D/g,''))||0}\n}\nfunction trackSince(items){items.forEach(function(x){if(x.updated&&x.updated>S.since)S.since=x.updated})}\nfunction rebuild(){\n  S.runners=Array.from(S.byId.values()).sort(function(a,b){return a.bibN-b.bibN||(a.bib<b.bib?-1:1)});\n  derive();\n}\nfunction replaceAll(items){S.byId=new Map();items.forEach(function(x){S.byId.set(x.id,normRunner(x))});S.since='';trackSince(items);rebuild()}\nfunction mergeItems(items){if(!items.length)return;items.forEach(function(x){S.byId.set(x.id,normRunner(x))});trackSince(items);rebuild()}\nfunction applyResult(r){if(r&&r.runner){S.byId.set(r.runner.id,normRunner(r.runner));trackSince([r.runner]);rebuild()}}\nfunction derive(){\n  var D={total:S.runners.length,checkOut:0,bibOut:0,shirtOut:0,pending:0,examples:0,given:{},due:{},cat:new Map()};\n  SIZES.forEach(function(s){D.given[s]=0;D.due[s]=0});\n  S.runners.forEach(function(r){\n    var c=D.cat.get(r.cat)||{reg:0,chk:0,bib:0,shirt:0};c.reg++;\n    if(r.example)D.examples++;\n    if(r.checkedIn){D.checkOut++;c.chk++}\n    if(r.bibIssued){D.bibOut++;c.bib++}\n    if(r.shirtIssued){D.shirtOut++;c.shirt++;if(D.given[r.shirtSize]!==undefined)D.given[r.shirtSize]++}\n    else if(D.due[r.size]!==undefined)D.due[r.size]++;\n    if(!(r.bibIssued&&r.shirtIssued))D.pending++;\n    D.cat.set(r.cat,c);\n  });\n  S.D=D;\n}\nfunction normCfg(x){\n  var lot={};SIZES.forEach(function(s){lot[s]=Math.max(0,parseInt(x.shirtLot&&x.shirtLot[s],10)||0)});\n  return {id:String(x.id||''),source:String(x.source||''),name:String(x.name||''),bibLot:Math.max(0,parseInt(x.bibLot,10)||0),shirtLot:lot,example:!!x.example}\n}\nfunction shirtState(sz){\n  var lot=S.cfg.shirtLot[sz]||0,given=S.D?S.D.given[sz]:0,due=S.D?S.D.due[sz]:0,rem=lot-given,st;\n  if(lot===0&&given===0)st='none';\n  else if(rem<0)st='over';\n  else if(rem===0)st='out';\n  else if(rem<=Math.max(5,Math.ceil(lot*.1)))st='low';\n  else st='ok';\n  return {lot:lot,given:given,rem:rem,due:due,spare:rem-due,state:st}\n}\nvar STATE_LABEL={ok:'In stock',low:'Low',out:'Out',over:'Oversold',none:'No lot'};\nfunction totals(){\n  var lot=0;SIZES.forEach(function(s){lot+=S.cfg.shirtLot[s]||0});\n  return {shirtLot:lot,bibLot:S.cfg.bibLot}\n}\n\n/* ---------- search ---------- */\nfunction search(q){\n  q=q.trim().toLowerCase();if(!q)return {list:[],more:0};\n  var hits=[],digits=/^\\d+$/.test(q);\n  S.runners.forEach(function(r){\n    var s=-1;\n    if(digits){\n      if(r.bibL===q)s=0;else if(r.bibL.indexOf(q)===0)s=1;else if(q.length>=3&&r.bibL.indexOf(q)>=0)s=2;\n      else if(q.length>=4&&r.phoneDigits.slice(-q.length)===q)s=3;else if(q.length>=4&&r.phoneDigits.indexOf(q)>=0)s=4;\n    }else{\n      if(q.indexOf('@')>0){if(r.emailL.indexOf(q)>=0)s=r.emailL===q?0:2}\n      var toks=q.split(/\\s+/);\n      if(s<0&&toks.every(function(t){return r.nameL.indexOf(t)>=0}))s=r.nameL.indexOf(toks[0])===0?1:2;\n      else if(toks.length===1&&r.bibL.indexOf(q)===0)s=1;\n    }\n    if(s>=0)hits.push([s,r]);\n  });\n  hits.sort(function(a,b){return a[0]-b[0]||a[1].bibN-b[1].bibN});\n  return {list:hits.slice(0,8).map(function(h){return h[1]}),more:Math.max(0,hits.length-8),exact:hits.length&&hits[0][0]===0}\n}\n\n/* ---------- render ---------- */\nvar raf=0;\nfunction schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;renderAll()})}\nfunction renderAll(){\n  $('#evName').textContent=S.cfg.name||'Race expo';\n  var live=$('#live'),txt=$('#liveTxt');\n  if(S.notStaff){live.className='live bad';txt.textContent='No access'}\n  else if(S.err){live.className='live bad';txt.textContent='Offline'}\n  else if(S.live){live.className='live ok';txt.textContent='Live · '+n(S.runners.length)+' runners'}\n  else{live.className='live wait';txt.textContent='Connecting'}\n  renderBanner();\n  if(S.ready&&!S.notStaff&&S.canWrite&&!S.ev){var bn=$('#banner');bn.hidden=false;bn.textContent=S.canAdmin?'No race found. In the Wix CMS, make sure the ID of your findmybib collection starts with Import (for example Import910), then open Setup and press Refresh races.':'No race found yet. Ask the admin to check the findmybib collection.'}\n  ['desk','stock','log','setup'].forEach(function(t){\n    $('#tab-'+t).hidden=S.tab!==t;\n    $('#t-'+t).setAttribute('aria-selected',S.tab===t?'true':'false');\n  });\n  if(S.tab==='desk'){renderResults();renderPanel();renderRail()}\n  else if(S.tab==='stock'){renderStock();renderSetupLive();fillSetup()}\n  else if(S.tab==='log')renderLog();\n  else renderSetupLive();\n}\nfunction renderBanner(){\n  var b=$('#banner'),msg='',act='';\n  if(S.notStaff){msg=S.setup?'The database has not been created yet. The site owner can create it now.':'You are logged in, but this login is not on the staff list. Ask the site owner to add your email to the ExpoStaff collection.';if(S.setup)act='<button type=\"button\" class=\"btn sm\" data-act=\"prepare\">Create database<\/button>'}\n  else if(S.err&&S.ready)msg='Connection problem. Changes may not save until it is back; the desk keeps retrying.';\n  else if(S.D&&S.D.examples>0){msg='Sample data is loaded. Replace it in Setup before the expo opens.';act='<button type=\"button\" class=\"link\" data-act=\"tab\" data-tab=\"setup\">Open Setup<\/button>'}\n  if(!msg){b.hidden=true;setHTML(b,'');return}\n  b.hidden=false;setHTML(b,'<span>'+esc(msg)+'<\/span>'+act);\n}\nfunction markHTML(l,on){return '<span class=\"mk'+(on?' on':'')+'\">'+(on?'✓ ':'')+l+'<\/span>'}\nfunction rowHTML(r){\n  return '<button type=\"button\" class=\"res\" data-act=\"open\" data-id=\"'+esc(r.id)+'\">'+\n    '<span class=\"chip\" style=\"--kc:'+catColor(r.cat)+'\">'+esc(r.bib)+'<\/span>'+\n    '<span class=\"who\"><b>'+esc(r.name)+'<\/b><small>'+esc(r.cat||'No category')+' · Size '+esc(r.size||'not set')+(r.phoneDigits?' · ···'+esc(r.phoneDigits.slice(-4)):'')+'<\/small><\/span>'+\n    '<span class=\"marks\">'+markHTML('Check-in',r.checkedIn)+markHTML('Bib',r.bibIssued)+markHTML('T-shirt',r.shirtIssued)+'<\/span><\/button>'\n}\nfunction renderResults(){\n  var el=$('#results');\n  if(S.sel){setHTML(el,'');return}\n  if(!S.runners.length){\n    setHTML(el,S.live?'<div class=\"empty\"><b>No runners yet<\/b><span>Import your registration list to start handing out bibs and T-shirts.<\/span><button type=\"button\" class=\"btn primary\" data-act=\"tab\" data-tab=\"setup\">Go to Setup<\/button><\/div>':'');\n    return;\n  }\n  var q=S.q.trim();\n  if(!q){setHTML(el,'<div class=\"empty\"><b>Ready for the next runner<\/b><span>Type a bib number, part of a name, or the last 4 digits of the phone.<\/span><\/div>');return}\n  var res=search(q);\n  if(!res.list.length){\n    setHTML(el,'<div class=\"empty\"><b>No match<\/b><span>Nobody matches “'+esc(q)+'”. Check the spelling or try the bib number.<\/span>'+(writable()?'<button type=\"button\" class=\"btn\" data-act=\"walkin\">Add as a new runner<\/button>':'')+'<\/div>');\n    return;\n  }\n  setHTML(el,res.list.map mporting||!!(S.D&&S.D.total>0);\n  var cats=S.D?Array.from(S.D.cat.keys()).filter(Boolean):[];\n  var dl=['5K','10K','21K','42K'].concat(cats.filter(function(c){return ['5K','10K','21K','42K'].indexOf(c)<0}));\n  var html=dl.map(function(c){return '<option value=\"'+esc(c)+'\">'}).join('');\n  if($('#catList')._h!==html){$('#catList').innerHTML=html;$('#catList')._h=html}\n}\n\n/* CSV */\nfunction parseTable(text){\n  text=text.replace(/^﻿/,'');\n  var first=text.split(/\\r?\\n/,1)[0]||'';\n  var d=first.indexOf('\\t')>=0?'\\t':(first.split(';').length>first.split(',').length?';':',');\n  var rows=[],row=[],f='',q=false;\n  for(var i=0;i<text.length;i++){\n    var c=text[i];\n    if(q){if(c==='\"'){if(text[i+1]==='\"'){f+='\"';i++}else q=false}else f+=c}\n    else if(c==='\"')q=true;\n    else if(c===d){row.push(f);f=''}\n    else if(c==='\\n'||c==='\\r'){if(c==='\\r'&&text[i+1]==='\\n')i++;row.push(f);f='';rows.push(row);row=[]}\n    else f+=c;\n  }\n  row.push(f);rows.push(row);\n  return rows.map(function(r){return r.map(function(x){return x.trim()})}).filter(function(r){return r.some(function(x){return x})})\n}\nfunction previewImport(){\n  var text=$('#csv').value,info=$('#impInfo');\n  if(!text.trim()){S.imp=null;info.className='msg';info.textContent='Nothing to import yet.';renderSetupLive();return}\n  var rows=parseTable(text);if(!rows.length){S.imp=null;renderSetupLive();return}\n  var head=rows[0].map(function(h){return h.toLowerCase()});\n  var find=function(re){for(var i=0;i<head.length;i++)if(re.test(head[i]))return i;return -1};\n  var idx={bib:find(/bib|chest|^no\\.?$|^number$/),name:find(/name|runner|participant/),cat:find(/categor|distance|event|race/),size:find(/size|shirt/),phone:find(/phone|mobile|contact|whatsapp/)};\n  var start=1;\n  if(!(idx.bib>=0&&idx.name>=0)){idx={bib:0,name:1,cat:2,size:3,phone:4};start=0}\n  var seen={},recs=[],skipped=0,badSize=0,dup=0;\n  for(var i=start;i<rows.length;i++){\n    var r=rows[i],get=function(k){return idx[k]>=0&&r[idx[k]]!=null?r[idx[k]]:''};\n    var bib=get('bib'),name=get('name');\n    if(!bib||!name){skipped++;continue}\n    var id=docId(bib);if(seen[id]){dup++;continue}seen[id]=1;\n    var rawSize=get('size'),size=normSize(rawSize);if(rawSize&&!size)badSize++;\n    recs.push({id:id,bib:bib,name:name,cat:get('cat'),size:size,phone:get('phone')});\n  }\n  var upd=recs.filter(function(x){return S.byId.has(S.ev+'~'+x.id)}).length;\n  S.imp={recs:recs,newCount:recs.length-upd,updCount:upd,skipped:skipped,dup:dup,badSize:badSize};\n  var bits=[n(recs.length)+' runners ready ('+n(recs.length-upd)+' new, '+n(upd)+' already registered and will be left unchanged)'];\n  if(skipped)bits.push(n(skipped)+' rows missing a bib or name');\n  if(dup)bits.push(n(dup)+' repeated bibs ignored');\n  if(badSize)bits.push(n(badSize)+' unrecognised sizes left blank');\n  info.className='msg'+(recs.length?'':' bad');info.textContent=recs.length?bits.join(' · '):'No usable rows found. Check the column order: bib, name, category, size, phone.';\n  renderSetupLive();\n}\nasync function withRetry(fn){\n  for(var a=0;;a++){\n    try{return await fn()}catch(e){\n      if(a>=4||!e||(e.code!=='resource_exhausted'&&e.code!=='unavailable'))throw e;\n      await sleep(400*Math.pow(2,a)+Math.random()*300);\n    }\n  }\n}\nasync function runPool(items,worker,onProgress){\n  var i=0,done=0,fail=0;\n  async function lane(){\n    while(i<items.length){\n      var it=items[i++];\n      try{await withRetry(function(){return worker(it)})}catch(e){fail++}\n      done++;onProgress(done,fail);\n    }\n  }\n  await Promise.all([lane(),lane(),lane(),lane(),lane(),lane()]);\n  return {done:done,fail:fail}\n}\nfunction progress(done,total){var p=$('#impProg');p.hidden=false;p.firstElementChild.style.width=Math.round(done/total*100)+'%'}\nasync function doImport(){\n  if(!S.imp||S.importing||!S.canAdmin)return;\n  var recs=S.imp.recs,info=$('#impInfo'),done=0,fail='';\n  S.importing=true;renderSetupLive();info.className='msg';info.textContent='Importing…';progress(0,recs.length);\n  try{\n    for(var i=0;i<recs.length;i+=200){\n      var chunk=recs.slice(i,i+200);\n      await api('importRunners',{rows:chunk.map(function(x){return {bib:x.bib,name:x.name,cat:x.cat,size:x.size,phone:x.phone}})},60000);\n      done+=chunk.length;progress(done,recs.length);info.textContent='Importing '+n(done)+' of '+n(recs.length)+'…';\n    }\n  }catch(e){fail=(e&&e.message)||'failed'}\n  S.importing=false;\n  if(fail){info.className='msg bad';info.textContent=n(done)+' imported, then it stopped: '+fail+'. Import the same list again to finish; runners already in are left unchanged.'}\n  else{info.className='msg good';info.textContent=n(recs.length)+' rows processed. Runners already registered were left unchanged.';$('#csv').value='';S.imp=null}\n  $('#impProg').hidden=true;\n  try{await fullLoad()}catch(e){S.err=e}\n  renderAll();\n}\nasync function saveCfg(){\n  if(!S.canAdmin)return;\n  var lot={};SIZES.forEach(function(s){lot[s]=Math.max(0,parseInt($('#cfgSizes [data-size=\"'+s+'\"]').value,10)||0)});\n  var data={name:$('#cfgName').value.trim(),bibLot:Math.max(0,parseInt($('#cfgBib').value,10)||0),shirtLot:lot};\n  var msg=$('#cfgMsg');msg.className='msg';msg.textContent='Saving…';\n  try{var c=await api('saveConfig',data);S.cfg=normCfg(c||data);S.cfgDirty=false;msg.className='msg good';msg.textContent='Saved.';try{await loadEvents()}catch(x){}renderAll()}\n  catch(e){msg.className='msg bad';msg.textContent=(e&&e.message)==='bad_name'?'The race name needs 2 to 40 characters.':'Could not save: '+((e&&e.message)||'try again')}\n}\nasync function addRunner(ev){\n  ev.preventDefault();\n  var msg=$('#addMsg'),bib=$('#addBib').value.trim(),name=$('#addName').value.trim();\n  if(!bib||!name){msg.className='msg bad';msg.textContent='Bib and name are required.';return}\n  var ex=S.byId.get(S.ev+'~'+docId(bib));\n  if(ex){msg.className='msg bad';msg.textContent='Bib '+ex.bib+' already belongs to ' msgEl){\n  var text=rows.map(function(r){return r.join(',')}).join('\\r\\n');\n  var box=$('#expText');box.hidden=false;box.value=text;\n  try{\n    var blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');\n    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();\n    setTimeout(function(){URL.revokeObjectURL(url)},4000);\n    msgEl.className='msg good';msgEl.textContent='Download started for '+name+'. If nothing downloads, copy the text below into a file with that name.';\n  }catch(e){msgEl.className='msg';msgEl.textContent='Copy the text below into a file named '+name+'.'}\n}\nfunction exportRoster(){\n  var rows=[['bib','name','category','phone','registered_size','checked_in','checkin_time','checkin_desk','bib_issued','bib_time','bib_desk','tshirt_issued','tshirt_size_given','tshirt_time','tshirt_desk']];\n  S.runners.forEach(function(r){rows.push([csvCell(r.bib),csvCell(r.name,1),csvCell(r.cat,1),csvCell(r.phone),csvCell(r.size),r.checkedIn?'yes':'no',csvCell(r.checkedInAt),csvCell(r.checkedInDesk,1),r.bibIssued?'yes':'no',csvCell(r.bibAt),csvCell(r.bibDesk,1),r.shirtIssued?'yes':'no',csvCell(r.shirtSize),csvCell(r.shirtAt),csvCell(r.shirtDesk,1)])});\n  saveFile('runners-and-status.csv',rows,$('#expMsg'));\n}\nfunction exportStock(){\n  var rows=[['size','lot','given','left','still_due','spare_after_due']];\n  SIZES.forEach(function(s){var t=shirtState(s);rows.push([s,t.lot,t.given,t.rem,t.due,t.spare])});\n  var t=totals();rows.push([]);rows.push(['bibs_lot',t.bibLot||S.D.total]);rows.push(['bibs_given',S.D.bibOut]);rows.push(['bibs_left',(t.bibLot||S.D.total)-S.D.bibOut]);\n  saveFile('stock-summary.csv',rows.map(function(r){return r.map(csvCell)}),$('#expMsg'));\n}\n\n/* ---------- hand-over ---------- */\nvar toastT=0;\nfunction toast(msg,err,undo){\n  var t=$('#toast');t.className='toast'+(err?' err':'');\n  t.innerHTML='<span>'+esc(msg)+'<\/span>'+(undo?'<button typ another desk. Log out there first, or use the login for this desk.':'Could not start: '+((e&&e.message)||'try again')}\n}\nasync function enterApp(){\n  var me=S.me;\n  S.canWrite=true;S.canAdmin=me.role==='admin';S.notStaff=false;S.ready=true;S.err=null;\n  S.desk=me.desk||'';var di=$('#deskName');di.value=S.desk||(me.role==='admin'?'Admin':'');di.readOnly=true;\n  fillRaceSel();\n  $('#raceSel').parentNode.hidden=raceFixed();\n  var cd=document.querySelector('[data-act=\"change-desk\"]');if(cd)cd.hidden=raceFixed()&&me.desks.length<=1;\n  $('#gate').hidden=true;$('#app').hidden=false;\n  S.tab='desk';\n  renderAll();\n  try{if(S.ev)await fullLoad();else{S.live=true;renderAll()}}catch(e){S.err=e;renderAll()}\n  poll();\n}\nasync function logout(){\n  try{await api('logout',{},8000)}catch(x){}\n  clearSession();showGate('login');$('#lgMsg').textContent='';\n}\nasync function firstSetup(ev){\n  ev.preventDefault();\n  var m=$('#fsMsg');m.className='msg';m.textContent='Working…';\n  try{\n    var r=await api('ensureSetup',{key:$('#fsKey').value,username:$('#fsUser').value.trim(),password:$('#fsPass').value},60000);\n    m.className='msg good';m.textContent=r.summary+'. Now log in above.';\n    $('#lgUser').value=$('#fsUser').value.trim();$('#fsKey').value='';$('#fsPass').value='';\n  }catch(e){var c=e&&e.message;m.className='msg bad';m.textContent=c==='already_set_up'?'Already set up. Add logins in the CMS (ExpoStaff).':'Could not set up: '+(c||'try again')}\n}\nfunction setDiag(kind,msg){\n  var el=$('#lgDiag');S.diag=kind;\n  if(kind==='ok'){el.hidden=true;return}\n  el.hidden=false;\n  el.textContent=kind==='nopage'\n    ?'The page is not answering. Check: (1) you opened the published site, not the editor; (2) the embed element ID is exactly expoFrame; (3) expo-page-code.js is pasted in this page\\'s own code panel and shows no red errors; (4) the site has been published after saving.'\n    :'The page code answers, but the backend failed ('+msg+'). Check that backe function pill(t,k){return '<span class="pill '+(k||'')+'">'+esc(t)+'</span>'}
function fdate(d){if(!d)return '';var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function ftime(iso){if(!iso)return '';var x=new Date(iso);return isNaN(x)?'':x.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function pct(a,b){return b>0?Math.min(100,Math.round(a*100/b)):0}
function bar(a,b){return '<div class="bar"><i style="width:'+pct(a,b)+'%"></i></div>'}
// two-step buttons: the first click arms, the second does it
function arm(key,label,act,extra){return '<button class="btn sm bad" data-act="'+act+'" data-arm="'+esc(key)+'" '+(extra||'')+'>'+(S.armed===key?'Sure?':esc(label))+'</button>'}

/* ---------- loading ---------- */
async function run(fn){
  if(S.busy)return;S.busy=true;
  try{return await fn()}catch(e){toast(msg(e.message),true)}finally{S.busy=false}
}
async function loadEvents(){
  var r=await api('listEvents');S.events=r.events.filter(function(e){return e.status!=='archived'});
  if(!S.events.some(function(e){return e.id===S.ev}))S.ev=S.events.length?S.events[0].id:'';
  try{var last=localStorage.getItem('rd.ev');if(last&&S.events.some(function(e){return e.id===last}))S.ev=last}catch(e){}
}
async function loadTab(){
  if(!S.ev){render();return}
  var t=S.tab;
  try{
    if(t==='overview')S.ov=await api('overview');
    else if(t==='volunteers'){var a=await Promise.all([api('listShifts'),api('listVolunteers')]);S.shifts=a[0].shifts;S.vols=a[1].volunteers}
    else if(t==='raceday'){var b=await Promise.all([api('listRun'),api('listLog')]);S.run=b[0].items;S.log=b[1].items}
    else if(t==='pacers')S.pace=await api('listPacers');
    else if(t==='safety')S.checks=(await api('listChecklist')).items;
    else if(t==='quals')S.qual=await api('listQuals');
    else if(t==='regs')S.regs=await api('listRegs');
    else if(t==='coaching'&&man()){var cc=await Promise.all([api('listAthletes',{},undefined,'train'),api('listCoaches',{},undefined,'train')]);S.coachL=cc[0];S.coaches=cc[1].coaches}
    else if(PLAN_TABS[t])S.plan=await api('listPlan',{kinds:planKindsFor(t)});
  }catch(e){toast(msg(e.message),true)}
  render();
}
async function afterLogin(){
  await loadEvents();
  if(!S.events.length&&man())S.tab='setup';
  else if(S.tab==='setup'&&S.events.length)S.tab='overview';
  render();await loadTab();
}

function rulesToText(rs){return rs.map(function(r){return [r.cat,r.text,r.alts.map(function(a){return (a.minKm||'')+'@'+(a.maxSec?hmsUi(a.maxSec):'')}).join('; ')].join(' | ')}).join('\n')}
function hmsUi(t){return Math.floor(t/3600)+':'+String(Math.floor(t%3600/60)).padStart(2,'0')}
function textToRules(tx){return tx.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split('|').map(function(x){return x.trim()});return {cat:p[0],text:p[1]||'',alts:(p[2]||'').split(';').map(function(x){return x.trim()}).filter(Boolean).map(function(a){var q=a.split('@');return {minKm:(q[0]||'').trim(),maxTime:(q[1]||'').trim()}})}})}

var PLAN_SEED={task:1,budget:1,supply:1,approval:1,ceremony:1,contact:1};
var PLAN_TABS={plan:['task','lesson'],money:['budget','sponsor'],approvals:['approval'],ceremonies:['ceremony'],logistics:['supply','contact','doc']};
function planKindsFor(t){return PLAN_TABS[t].filter(function(k){return !(S.me&&S.me.role==='viewer'&&(KD[k].money||k==='contact'))})}
function canKind(k){return KD[k].money?man():can()}
function cellOf(c,i){var v=c[1];if(typeof v==='function')return v(i);v=i[v];return v?(c[1]==='due'?esc(fdate(v)):esc(v)):''}
function planForm(kind){
  var K=KD[kind],pe=S.pedit;if(!pe||pe.kind!==kind)return '';
  var v=pe.vals||{};
  var fs=K.f.map(function(f){
    var k=f[0],t=f[2],val=v[k]===undefined||v[k]===null?'':v[k],req=f[3]?' required':'';
    var span=t==='area'?' style="grid-column:1/-1"':'';
    var inp;
    if(t==='phase')inp='<select name="phase">'+Object.keys(K.ph).map(function(p){return '<option value="'+p+'"'+((val||Object.keys(K.ph)[0])===p?' selected':'')+'>'+esc(K.ph[p])+'</option>'}).join('')+'</select>';
    else if(t==='status')inp='<select name="status">'+Object.keys(K.st).map(function(p){return '<option value="'+p+'"'+((val||Object.keys(K.st)[0])===p?' selected':'')+'>'+esc(K.st[p])+'</option>'}).join('')+'</select>';
    else if(t==='area')inp='<textarea name="'+k+'" rows="2" maxlength="600">'+esc(val)+'</textarea>';
    else if(t==='cat')inp='<input name="'+k+'" list="dl'+kind+'" value="'+esc(val)+'" maxlength="40"><datalist id="dl'+kind+'">'+(CATS[kind]||[]).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist>';
    else if(t==='num')inp='<input name="'+k+'" type="number" min="0" step="any" value="'+esc(val)+'">';
    else if(t==='date')inp='<input name="'+k+'" type="date" value="'+esc(val)+'">';
    else if(t==='time')inp='<input name="'+k+'" type="time" value="'+esc(val)+'">';
    else if(t==='url')inp='<input name="'+k+'" type="url" value="'+esc(val)+'" placeholder="https://"'+req+'>';
    else inp='<input name="'+k+'" value="'+esc(val)+'" maxlength="120"'+req+'>';
    return '<label class="f"'+span+'>'+esc(f[1])+inp+'</label>'});
  return '<form id="planForm" data-kind="'+kind+'" class="form" style="margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:10px"><b style="grid-column:1/-1">'+(pe.id?'Edit':'Add')+' '+esc(K.one)+'</b>'+fs.join('')+'<div class="row" style="grid-column:1/-1"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-act="pcancel">Cancel</button></div></form>';
}
function planSection(kind,opts){
  opts=opts||{};var K=KD[kind],items=(S.plan&&S.plan.items[kind])||[];
  var w=canKind(kind);
  var head='<div class="row between"><h3>'+esc(K.many)+'</h3><span class="row"><span class="muted">'+items.length+' item'+(items.length===1?'':'s')+'</span>'+(items.length?'<button class="btn sm" data-act="pcsv" data-kind="'+kind+'">Download CSV</button>':'')+(w?'<button class="btn sm pri" data-act="pnew" data-kind="'+kind+'">Add</button>':'')+'</span></div>';
  if(opts.note)head+='<p class="muted" style="margin-top:4px">'+esc(opts.note)+'</p>';
  var body='';
  if(!items.length){
    body='<p class="muted" style="margin-top:8px">Nothing here yet.'+(man()&&PLAN_SEED[kind]?' <button class="btn sm" data-act="pseed" data-kind="'+kind+'">Load the starter list</button>':'')+'</p>';
  }else{
    var keys=K.group==='phase'?Object.keys(K.ph):K.group==='status'?Object.keys(K.st):Array.from(new Set(items.map(function(i){return i.cat||'Other'}))).sort();
    var showSt=Object.keys(K.st).length>1;
    keys.forEach(function(g){
      var gi=items.filter(function(i){return (K.group==='phase'?i.phase:K.group==='status'?i.status:(i.cat||'Other'))===g});
      if(!gi.length)return;
      var label=K.group==='phase'?K.ph[g]:K.group==='status'?K.st[g]:g;
      body+='<div class="sec" style="margin-top:14px">'+esc(label)+' <span class="muted">('+gi.length+')</span></div><div class="scroll"><table><tr>'+(showSt?'<th>Status</th>':'')+'<th>Item</th>'+K.cols.map(function(c){return '<th>'+esc(c[0])+'</th>'}).join('')+'<th></th></tr>'
       +gi.map(function(i){
         var sel=showSt?'<td><select data-act="pstatus" data-id="'+esc(i.id)+'" aria-label="Status"'+(w?'':' disabled')+'>'+Object.keys(K.st).map(function(s){return '<option value="'+s+'"'+(i.status===s?' selected':'')+'>'+esc(K.st[s])+'</option>'}).join('')+'</select></td>':'';
         return '<tr>'+sel+'<td><b>'+esc(i.title)+'</b>'+(i.overdue?' '+pill('overdue','bad'):'')+(i.notes?'<br><small class="muted">'+esc(i.notes)+'</small>':'')+'</td>'+K.cols.map(function(c){return '<td>'+cellOf(c,i)+'</td>'}).join('')
          +'<td style="white-space:nowrap">'+(w?'<button class="btn sm" data-act="pedit" data-kind="'+kind+'" data-id="'+esc(i.id)+'">Edit</button> ':'')+(man()?arm('pd'+i.id,'×','pdel','data-kind="'+kind+'" data-id="'+esc(i.id)+'"'):'')+'</td></tr>'}).join('')+'</table></div>'});
  }
  return '<div class="card">'+head+planForm(kind)+body+'</div>';
}
function sumCard(l,n,sub,bad){return '<div class="card kpi"><div class="l">'+esc(l)+'</div><div class="n" style="'+(bad?'color:var(--bad)':'')+'">'+n+'</div><small>'+(sub||'')+'</small></div>'}
function planLoading(){return '<div class="card muted">Loading...</div>'}
function planTabView(){
  if(!S.plan)return planLoading();var s=S.plan.summary,t=s.tasks;
  return '<div class="stack"><div class="grid g4">'+sumCard('Tasks done',t.done+' <small>/ '+t.total+'</small>',bar(t.done,t.total))+sumCard('Overdue',s.overdue,'across all planning lists',s.overdue>0)+sumCard('Blocked',t.blocked,'tasks',t.blocked>0)+sumCard('Open lessons',s.lessons.open,'after the race')+'</div>'
   +planSection('task',{note:'Everything to do, from 90 days out to the debrief. Change the status in the first column.'})+planSection('lesson',{note:'Fill in after the race: what worked, what to fix, ideas for next year.'})+'</div>';
}
function moneyTabView(){
  if(!S.plan)return planLoading();var b=S.plan.summary.budget,sp=S.plan.summary.sponsors;if(!b)return '<div class="card muted">You do not have access to money details.</div>';
  var z=function(n){return INR(n)||'₹0'};
  var cats=b.byCat.length?'<div class="card"><h3>Costs by category</h3><div class="scroll"><table><tr><th>Category</th><th>Planned</th><th>Actual</th><th>Difference</th></tr>'+b.byCat.map(function(c){return '<tr><td>'+esc(c.cat)+'</td><td>'+z(c.planned)+'</td><td>'+z(c.actual)+'</td><td>'+(c.actual>c.planned?pill('over by '+INR(c.actual-c.planned),'bad'):z(c.planned-c.actual))+'</td></tr>'}).join('')+'</table></div></div>':'';
  return '<div class="stack"><div class="grid g4">'+sumCard('Planned costs',z(b.expPlanned),'spent so far '+z(b.expActual),b.overBy>0)+sumCard('Income expected',z(b.incPlanned),'received '+z(b.incActual))+sumCard('Planned result',(b.netPlanned<0?'-':'')+z(Math.abs(b.netPlanned)),b.netPlanned<0?'planned shortfall':'planned surplus',b.netPlanned<0)+sumCard('Committed, not paid',z(b.committedUnpaid),'cost lines marked committed')+'</div>'
   +'<div class="grid g4">'+sumCard('Sponsor cash promised',z(sp.cashPromised),sp.coversPct===null?'':'covers '+sp.coversPct+'% of planned costs')+sumCard('Sponsor cash received',z(sp.cashReceived),'still to collect '+z(sp.outstanding))+sumCard('In the pipeline',z(sp.pipeline),'leads, pitched, negotiating')+sumCard('In-kind support',z(sp.inKind),'committed or received')+'</div>'
   +cats+planSection('budget',{note:'Planned is what you expect to spend or earn. Actual is what really happened. Marking a line Paid fills Actual with Planned if it is empty.'})+planSection('sponsor',{note:'Track each sponsor from lead to money received, and what you owe them (logo, banner, stall, speech).'})+'</div>';
}

   +planSection('supply',{note:'Set Needed and Have. An item counts as short while Have is below Needed and it has not reached the site.'})+(S.plan.items.contact?planSection('contact',{note:'Vendors and authorities you may need to call on the day.'}):'')+planSection('doc',{note:'Links to permits, route maps, contracts and insurance papers. Keep the files in Drive or similar and paste the link.'})+'</div>';
}

function coachingView(){
  var L=S.coachL;if(!L)return '<div class="card muted">Loading...</div>';
  var rank=function(a){return a.coachStatus==='requested'?0:a.coachStatus==='active'?2:1};
  var list=L.athletes.slice().sort(function(a,b){return rank(a)-rank(b)||String(a.name).localeCompare(String(b.name))});
  var coached=list.filter(function(a){return a.coachStatus==='active'}).length;
  var opts='<option value="">Assign coach...</option>'+S.coaches.map(function(c){return '<option value="'+esc(c.username)+'">'+esc(c.name)+(c.role==='coach'?'':' ('+esc(c.role)+')')+'</option>'}).join('');
  var rows=list.map(function(a){
    var st=a.coachStatus==='active'?pill('Coached by '+a.coach,'good'):a.coachStatus==='requested'?pill('Wants a coach','warn'):pill('Free plan');
    var act=a.coachStatus==='active'?arm('cs'+a.id,'Stop coaching','cstop','data-id="'+esc(a.id)+'"')
      :(S.coaches.length?'<select data-act="cassign" data-id="'+esc(a.id)+'" aria-label="Assign a coach">'+opts+'</select>':'<span class="muted">No coach logins yet</span>')+(a.coachStatus==='requested'?' '+arm('cd'+a.id,'Decline','cdecline','data-id="'+esc(a.id)+'"'):'');
    return '<tr><td><b>'+esc(a.name)+'</b><br><small>'+esc(a.phone)+' · '+esc(a.level)+'</small>'+(a.reqNote?'<br><small>“'+esc(a.reqNote)+'”</small>':'')+'</td><td>'+esc(a.planName)+'<br>'+st+'</td><td>'+(a.stats&&a.stats.adherence!==null?'<b>'+a.stats.adherence+'%</b> <span class="muted">('+a.stats.done+'/'+a.stats.due+')</span>':'<span class="muted">not started</span>')+'</td><td style="white-space:nowrap">'+act+'</td></tr>'}).join('');
  return '<div class="stack"><div class="grid g4">'+sumCard('Runners on a plan',L.totals.active,L.totals.athletes+' signed up')+sumCard('Want a coach',L.totals.requests||0,'waiting for you',(L.totals.requests||0)>0)+sumCard('Coached',coached,'with a coach assigned')+'</div>'
   +'<div class="card"><div class="row between"><h3>Coaching</h3></div><p class="muted" style="margin-top:4px">Assign a coach to any runner, whether or not they asked. Coaches work from the coach page (/coach): they edit the plan, give feedback and message the runner. Coach logins are the ExpoStaff rows with role coach (admin and director logins can coach too).</p>'
   +'<div class="scroll"><table><tr><th>Runner</th><th>Plan</th><th>Done so far</th><th></th></tr>'+(rows||'<tr><td colspan="4" class="muted">No runners on a plan yet.</td></tr>')+'</table></div></div></div>';
}
/* ---------- actions ---------- */
function formData(f){var o={};Array.prototype.forEach.call(f.elements,function(el){if(!el.name)return;o[el.name]=el.type==='checkbox'?el.checked:el.value});return o}
function download(name,text){try{var b=new Blob([text],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}catch(e){toast('Download is blocked here. Copy the list instead.',true)}}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function doTab(t){S.tab=t;S.armed=null;S.pedit=null;S.plan=null;S.editShift=null;S.editPacer=null;render();await loadTab()}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  var ak=b.getAttribute('data-arm');
  if(ak){if(S.armed!==ak){S.armed=ak;render();return}S.armed=null}
  var go=function(fn){run(async function(){await fn();render()})};
  var reload=function(){return loadTab()};
  if(act==='tab')doTab(b.getAttribute('data-tab'));
  else if(act==='qOk'||act==='qNo'||act==='qWaive'){var ne=document.querySelector('[data-note="'+id+'"]');var nt=ne?ne.value:'';var stt=act==='qOk'?'approved':act==='qNo'?'rejected':'waived';run(async function(){await api('decideQual',{runnerId:id,status:stt,note:nt});toast('Saved');await reload()})}
  else if(act==='loadWix')run(async function(){S.wixEvents=(await api('listWixEvents')).events;render()});
  else if(act==='chkForm'){S.mapOpen=!S.mapOpen;render();if(S.mapOpen&&!S.wixForm)run(async function(){S.wixForm=await api('wixFormFields');render()})}
  else if(act==='unlinkWix')run(async function(){await api('linkWixEvent',{wixEventId:''});S.wixEvents=null;S.wixForm=null;toast('Unlinked');await loadTab()});
  else if(act==='impRegs')run(async function(){var cur='',add=0,upd=0,sk=0;for(var i=0;i<60;i++){var r=await api('importRegs',{cursor:cur});add+=r.added;upd+=r.updated;sk+=r.skipped.cancelled+r.skipped.noName;S.impMsg='importing... '+(add+upd);render();cur=r.next;if(r.done)break}S.impMsg='Imported: '+add+' new, '+upd+' updated, '+sk+' skipped (cancelled or no name)';await reload()});
  else if(act==='regCsv'){var rr=S.regs.rows;download('registrations.csv',[['Name','Email','Phone','Ticket','Ticket no.','Size','Bib name','Payment pending']].concat(rr.map(function(r){return [r.name,r.email,r.phone,r.cat,r.ticket,r.size,r.bibName,r.unpaid?'yes':'']})).map(function(r){return r.map(csvCell).join(',')}).join('\n'))}
  else if(act==='logout'){if(S.token)api('logout').catch(function(){});dropExpo();S.token='';S.me=null;S.ev='';S.ov=null;S.cred=null;S.expoOnly=false;render()}
  else if(act==='copyLink'){var t=$('#linkOut').textContent;try{navigator.clipboard.writeText(t).then(function(){toast('Link copied')},function(){toast(t)})}catch(x){toast(t)}}
  else if(act==='shiftNew'){S.editShift={id:'',role:'',location:'',date:(S.events.find(function(x){return x.id===S.ev})||{}).date||'',start:'05:00',end:'09:00',need:'4',notes:''};render()}
  else if(act==='shiftEdit'){S.editShift=Object.assign({},S.shifts.find(function(s){return s.id===id}));render()}
  else if(act==='shiftCancel'){S.editShift=null;render()}
  else if(act==='shiftDel')run(async function(){await api('removeShift',{id:id});toast('Shift deleted');await reload()});
  else if(act==='vstat')run(async function(){await api('setVolunteerStatus',{id:id,status:b.getAttribute('data-st')});await reload()});
  else if(act==='unassign')run(async function(){await api('unassignShift',{assignId:id});await reload()});
  else if(act==='ciIn'||act==='ciOut'){var code=($('#ciCode').value||'').trim();S.ci=code;if(!code){toast('Type the code first',true);return}
    run(async function(){var r=await api('volunteerCheck',{code:code,action:act==='ciOut'?'out':'in'});S.ci='';toast(r.name+(r.action==='in'?' checked in as ':' checked out ')+(r.action==='in'?r.role:'('+r.hours+' h)'));await reload()})}
  else if(act==='csv'){var rows=[['Name','Mobile','Email','Club','Status','Code','Hours','Shifts']].concat(S.vols.map(function(v){return [v.name,v.phone,v.email,v.club,v.status,v.code,v.hours,v.shifts.map(function(s){return s.role+' '+s.date+' '+s.start}).join('; ')]}));download('volunteers.csv',rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'))}
  else if(act==='runStep'){var it=S.run.find(function(r){return r.id===id});var nx={todo:'doing',doing:'done',done:'todo'}[it.status];run(async function(){await api('saveRunItem',{id:id,time:it.time,what:it.what,owner:it.owner,status:nx});await reload()})}
  else if(act==='runDel')run(async function(){await api('removeRunItem',{id:id});await reload()});
  else if(act==='groupAdd'){var d=document.createElement('div');d.innerHTML=groupRow({label:'',finish:'',need:2});$('#groupRows').appendChild(d.firstChild)}
  else if(act==='groupDel'){var r=b.closest('.gr');if(r)r.remove()}
  else if(act==='pacerEdit'){S.editPacer=Object.assign({},S.pace.pacers.find(function(p){return p.id===id}));render();var f=$('#pacerForm');if(f&&f.scrollIntoView)f.scrollIntoView({block:'center'})}
  else if(act==='pacerCancel'){S.editPacer=null;render()}
  else if(act==='pacerDel')run(async function(){await api('removePacer',{id:id});await reload()});
  else if(act==='checkDel')run(async function(){await api('removeCheck',{id:id});await reload()});
  else if(act==='pnew'){var k0=b.getAttribute('data-kind');S.pedit={kind:k0,id:'',vals:{}};render();var f0=$('#planForm');if(f0&&f0.scrollIntoView)f0.scrollIntoView({block:'center'})}
  else if(act==='pedit'){var k1=b.getAttribute('data-kind'),it1=((S.plan&&S.plan.items[k1])||[]).find(function(x){return x.id===id});if(it1){S.pedit={kind:k1,id:id,vals:Object.assign({},it1)};render();var f1=$('#planForm');if(f1&&f1.scrollIntoView)f1.scrollIntoView({block:'center'})}}
  else if(act==='cstop')run(async function(){await api('stopCoaching',{enroll:id},undefined,'train');toast('Back to the free plan');await reload()});
  else if(act==='cdecline')run(async function(){await api('declineCoaching',{enroll:id},undefined,'train');toast('Request declined');await reload()});
  else if(act==='pcancel'){S.pedit=null;render()}
  else if(act==='pdel')run(async function(){await api('removePlanItem',{id:id});toast('Removed');await reload()});
  else if(act==='pseed')run(async function(){var r=await api('seedPlanLists',{kinds:[b.getAttribute('data-kind')]});var n=0;Object.keys(r.added).forEach(function(k){n+=r.added[k]});toast('Added '+n+' starter items');await reload()});
  else if(act==='pcsv'){var k2=b.getAttribute('data-kind'),ls=(S.plan&&S.plan.items[k2])||[];download(k2+'.csv',[['Title','Category','Group','Status','Owner','Party','Contact','Due','Time','Amount','Actual','Ref','Link','Notes']].concat(ls.map(function(i){return [i.title,i.cat,i.phase,i.status,i.owner,i.party,i.contact,i.due,i.time,i.amount,i.amount2,i.ref,i.link,i.notes]})).map(function(r){return r.map(csvCell).join(',')}).join('\n'))}
  else if(act==='evEdit'){S.editEvent=Object.assign({},S.events.find(function(x){return x.id===id}));render()}
  else if(act==='evNew'){S.editEvent=null;render()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='evPick'){S.ev=t.value;try{localStorage.setItem('rd.ev',S.ev)}catch(x){}S.ov=null;loadTab()}
  else if(t.id==='volF'){S.volF=t.value;render()}
  else if(t.id==='regQ'){}
  else if(t.id==='qF'){S.qF=t.value;render()}
  else if(t.id==='logF'){S.logFilter=t.value;render()}
  else if(t.id==='baseUrl'){S.base=t.value.trim()||S.base;try{localStorage.setItem('rd.base',S.base)}catch(x){}render()}
  else if(t.getAttribute('data-act')==='cassign'){var cid=t.getAttribute('data-id'),cu=t.value;if(cu)run(async function(){await api('assignCoach',{enroll:cid,coach:cu},undefined,'train');toast('Coach assigned');await loadTab()})}
  else if(t.getAttribute('data-act')==='pstatus'){var pid=t.getAttribute('data-id'),pst=t.value;run(async function(){await api('setPlanStatus',{id:pid,status:pst});await loadTab()})}
  else if(t.getAttribute('data-act')==='assign'&&t.value){var sid=t.value,vid=t.getAttribute('data-vid');run(async function(){await api('assignShift',{volunteerId:vid,shiftId:sid});await loadTab()})}
  else if(t.getAttribute('data-act')==='tick'){var id=t.getAttribute('data-id'),on=t.checked;run(async function(){await api('toggleCheck',{id:id,done:on});S.checks=(await api('listChecklist')).items;render()}).then(function(){if(!S.busy)return});}
});
document.addEventListener('input',function(e){if(e.target.id==='regQ'){S.regQ=e.target.value;var p2=e.target.selectionStart;render();var e2=$('#regQ');if(e2){e2.focus();try{e2.setSelectionRange(p2,p2)}catch(x){}}}if(e.target.id==='volQ'){S.volQ=e.target.value;var pos=e.target.selectionStart;render();var el=$('#volQ');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,id=f.id,d=formData(f);
  if(id==='loginForm'){S.loginErr='';run(async function(){
    var u0=d.lgUser||$('#lgUser').value,p0=$('#lgPass').value;
    try{var r=await api('login',{username:u0,password:p0,token:''});S.token=r.token;S.me=r;S.cred=EXPO_SRC&&r.role==='director'?{u:u0,p:p0}:null;await afterLogin()}
    catch(x){
      // A correct login that has no Director role is an Expo desk login: send it straight to the Expo desk.
      if(x.message==='not_allowed'&&EXPO_SRC){S.cred={u:u0,p:p0};S.me={name:u0,role:'desk'};S.expoOnly=true;render();return}S.loginErr=msg(x.message);var el=$('#lgErr');if(el)el.textContent=S.loginErr;toast(S.loginErr,true)}})}
  else if(id==='setupForm'){run(async function(){try{var r=await api('ensureSetup',{key:$('#suKey').value,username:$('#suUser').value,password:$('#suPass').value,token:''});$('#suMsg').textContent=r.summary}catch(x){$('#suMsg').textContent=x.message}})}
  else if(id==='shiftForm')run(async function(){await api('saveShift',Object.assign({id:S.editShift.id||undefined},d));S.editShift=null;toast('Shift saved');await loadTab()});
  else if(id==='addVol')run(async function(){var r=await api('addVolunteer',d);toast('Added. Code '+r.code);await loadTab()});
  else if(id==='runForm')run(async function(){await api('saveRunItem',d);await loadTab()});
  else if(id==='logForm')run(async function(){await api('addLog',d);await loadTab()});
  else if(f.classList.contains('closeForm'))run(async function(){await api('closeLog',{id:f.getAttribute('data-id'),resolution:d.resolution});await loadTab()});
  else if(id==='groupForm')run(async function(){var groups=Array.prototype.map.call(f.querySelectorAll('.gr'),function(r){return {label:r.querySelector('[name=label]').value,finish:r.querySelector('[name=finish]').value,need:r.querySelector('[name=need]').value}});await api('savePaceGroups',{groups:groups,distanceKm:d.distanceKm});toast('Pace groups saved');await loadTab()});
  else if(id==='pacerForm')run(async function(){await api('savePacer',Object.assign({id:S.editPacer&&S.editPacer.id||undefined},d));S.editPacer=null;toast('Pacer saved');await loadTab()});
  else if(id==='linkForm')run(async function(){await api('linkWixEvent',{wixEventId:d.wixEventId});toast('Linked');await loadTab()});
  else if(id==='mapForm')run(async function(){await api('saveWixMap',{map:d});toast('Saved. Press Import / refresh to apply it.');S.wixForm=await api('wixFormFields');await loadTab()});
  else if(id==='ruleForm')run(async function(){var r=await api('saveQualRules',{rules:textToRules(d.rules)});toast('Rules saved ('+r.count+')');await loadTab()});
  else if(f.classList.contains('claimForm'))run(async function(){await api('saveQualClaim',{runnerId:f.getAttribute('data-rid'),text:d.text,km:d.km,time:d.time,link:d.link});toast('Claim saved');await loadTab()});
  else if(id==='planForm')run(async function(){var kd=f.getAttribute('data-kind');await api('savePlanItem',Object.assign({kind:kd,id:S.pedit&&S.pedit.id||undefined},d));S.pedit=null;toast('Saved');await loadTab()});
  else if(id==='checkForm')run(async function(){await api('addCheck',d);await loadTab()});
  else if(id==='eventForm')run(async function(){var r=await api('saveEvent',Object.assign({id:S.editEvent&&S.editEvent.id||undefined},d));S.editEvent=null;toast('Race saved');S.ev=r.event.id;await loadEvents();S.ev=r.event.id;await loadTab()});
});
render();
})();
</script>
</body>
</html>
